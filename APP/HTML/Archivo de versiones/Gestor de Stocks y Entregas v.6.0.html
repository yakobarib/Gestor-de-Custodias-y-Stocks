  <title>Gestor de Stock en Custodia · Recambios Ibiza</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>

  :root {
    --bg: #0e0f11; --surface: #16181c; --surface2: #1e2128; --border: #2a2d35;
    --accent: #E20613; --accent-dim: rgba(226,6,19,0.12); --accent-glow: rgba(226,6,19,0.3);
    --blue2: #002D5A; --green: #4caf7d; --blue: #5b8def;
    --text: #e8eaf0; --text-dim: #7a7f8e; --text-faint: #454952;
  }

  [data-theme="light"] {
    --bg: #F4F4F4; --surface: #FFFFFF; --surface2: #F4F4F4; --border: #D8D8D8;
    --accent: #E20613; --accent-dim: rgba(226,6,19,0.08); --accent-glow: rgba(226,6,19,0.25);
    --blue2: #002D5A; --green: #2e7d32; --blue: #002D5A;
    --text: #002D5A; --text-dim: #4a5568; --text-faint: #a0aec0;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Syne', sans-serif; min-height: 100vh; transition: background 0.2s, color 0.2s; }
  .app { display: flex; flex-direction: column; min-height: 100vh; }
  .header { display: flex; align-items: center; justify-content: space-between; padding: 0 28px; height: 60px; background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  .logo { display: flex; align-items: center; gap: 12px; }
  .logo-text { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 16px; letter-spacing: -0.5px; color: var(--text); }
  .logo-sub { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-dim); margin-top: -2px; }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .header-save { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-dim); }
  .header-save.saved { color: var(--green); }
  .theme-toggle { display: flex; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 3px; gap: 2px; }
  .theme-opt { padding: 5px 14px; border-radius: 6px; border: none; cursor: pointer; font-family: 'Syne', sans-serif; font-size: 12px; font-weight: 700; transition: all 0.2s; background: transparent; color: var(--text-dim); white-space: nowrap; }
  .theme-opt.active { background: #002D5A; color: #fff; box-shadow: 0 2px 8px rgba(0,45,90,0.4); }
  .theme-opt:not(.active):hover { color: var(--text); }
  @keyframes blink-red { 0%,100% { color: #E20613; } 50% { color: rgba(226,6,19,0.25); } }
  .kpi-value.debt-alert { animation: blink-red 1.2s ease-in-out infinite; font-weight: 900; }
  .krafted { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-faint); margin-top: 20px; }
  .krafted span { color: #a8e63d; font-weight: 700; }
  [data-theme="light"] .krafted span { color: #002D5A; }
  /* ── Layout sticky ── */
  html, body { height: 100%; }
  .app { height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
  .main { flex: 1; overflow: hidden; display: flex; flex-direction: column; padding: 0; max-width: 100%; }
  .main-inner { max-width: 1400px; width: 100%; margin: 0 auto; flex: 1; overflow: hidden; display: flex; flex-direction: column; }
  .dash-top { padding: 20px 28px 0; flex-shrink: 0; background: var(--bg); }
  .dash-body { flex: 1; overflow-y: auto; padding: 0 28px 28px; }
  .tab-scroll { flex: 1; overflow-y: auto; padding: 28px; }
  .btn-green { background: #1a7f4b; color: #fff; }
  .btn-green:hover { background: #1d9458; }
  .nav { display: flex; gap: 4px; padding: 0 28px; background: var(--surface); border-bottom: 1px solid var(--border); }
  .nav-btn { padding: 12px 18px; border: none; background: none; cursor: pointer; font-family: 'Syne', sans-serif; font-weight: 600; font-size: 13px; color: var(--text); border-bottom: 2px solid transparent; transition: all 0.15s; display: flex; align-items: center; gap: 7px; }
  .nav-btn:hover { color: var(--text); }
  .nav-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  .badge { background: var(--accent); color: #fff; border-radius: 10px; padding: 1px 6px; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; }
  .badge-warn { background: #E20613; }
  .main { flex: 1; padding: 28px; max-width: 1400px; width: 100%; margin: 0 auto; }
  .kpis { display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; margin-bottom: 24px; }
  .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 18px 20px; transition: box-shadow 0.2s; }
  .kpi:hover { box-shadow: 0 4px 16px rgba(226,6,19,0.1); }
  .kpi-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
  .kpi-value { font-family: 'JetBrains Mono', monospace; font-size: 28px; font-weight: 700; }
  .kpi-value.accent { color: var(--accent); }
  .kpi-value.green { color: var(--green); }
  .kpi-sub { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-dim); margin-top: 4px; }
  .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .section-title { font-size: 16px; font-weight: 700; color: var(--text); }
  .section-sub { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-dim); margin-top: 2px; }
  .search-bar { display: flex; gap: 10px; margin-bottom: 16px; align-items: center; flex-wrap: wrap; }
  .search-input { flex: 1; min-width: 180px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--text); outline: none; transition: border-color 0.15s; }
  .search-input:focus { border-color: var(--accent); }
  .search-input::placeholder { color: var(--text-faint); }
  .filter-select { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--text); outline: none; cursor: pointer; }
  .filter-select option { background: var(--surface); }
  .table-wrap { overflow-x: auto; border-radius: 8px; border: 1px solid var(--border); }
  table { width: 100%; border-collapse: collapse; font-family: 'JetBrains Mono', monospace; font-size: 12px; }
  th { background: var(--surface2); padding: 10px 14px; text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-dim); border-bottom: 1px solid var(--border); white-space: nowrap; position: sticky; top: 0; z-index: 5; }
  td { padding: 11px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--surface2); }
  .stock-bar-wrap { width: 80px; }
  .stock-bar-track { background: var(--border); border-radius: 3px; height: 5px; overflow: hidden; }
  .stock-bar-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
  .stock-pct { font-size: 10px; color: var(--text-dim); margin-top: 3px; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; }
  .tag-accent { background: var(--accent-dim); color: var(--accent); border: 1px solid var(--accent-glow); }
  .tag-green { background: rgba(46,125,50,0.1); color: var(--green); }
  .tag-blue { background: rgba(0,45,90,0.1); color: var(--blue2); }
  .tag-red { background: rgba(226,6,19,0.12); color: #E20613; }
  .tag-orange { background: rgba(255,140,0,0.12); color: #ff8c00; }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; border-radius: 8px; border: none; cursor: pointer; font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 600; transition: all 0.15s; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { filter: brightness(1.1); }
  .btn-ghost { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
  .btn-danger { background: rgba(226,6,19,0.1); color: #E20613; border: 1px solid rgba(226,6,19,0.2); }
  .btn-danger:hover { background: rgba(226,6,19,0.2); }
  .btn-sm { padding: 5px 10px; font-size: 11px; border-radius: 5px; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(4px); }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 28px; width: 100%; max-width: 620px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); max-height: 90vh; overflow-y: auto; }
  .modal-title { font-size: 18px; font-weight: 800; margin-bottom: 6px; color: var(--text); }
  .modal-sub { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-dim); margin-bottom: 20px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-group.full { grid-column: 1 / -1; }
  label { font-family: 'JetBrains Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-dim); }
  input, select, textarea { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--text); outline: none; transition: border-color 0.15s; width: 100%; }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  input::placeholder, textarea::placeholder { color: var(--text-faint); }
  select option { background: var(--surface); }
  textarea { resize: vertical; min-height: 70px; }
  .form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
  .alert { border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; font-family: 'JetBrains Mono', monospace; font-size: 12px; }
  .alert-warn { background: var(--accent-dim); border: 1px solid var(--accent-glow); color: var(--accent); }
  .alert-info { background: rgba(0,45,90,0.07); border: 1px solid rgba(0,45,90,0.2); color: var(--blue2); }
  .history-item { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; margin-bottom: 8px; display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: start; transition: box-shadow 0.15s; }
  .history-item:hover { box-shadow: 0 2px 12px rgba(226,6,19,0.08); }
  .history-date { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-dim); white-space: nowrap; }
  .history-client { font-weight: 700; font-size: 13px; color: var(--text); }
  .history-product { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-dim); margin-top: 2px; }
  .history-uds { font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 700; color: var(--accent); text-align: right; }
  .history-uds-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-dim); }
  .empty { text-align: center; padding: 60px 20px; }
  .empty-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.3; }
  .empty-title { font-size: 16px; font-weight: 700; color: var(--text-dim); margin-bottom: 6px; }
  .empty-sub { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-faint); }
  .loader { display: flex; align-items: center; justify-content: center; min-height: 300px; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--text-dim); gap: 10px; }
  .spinner { width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .pdf-drop { border: 2px dashed var(--border); border-radius: 8px; padding: 20px; text-align: center; cursor: pointer; transition: all 0.2s; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-dim); margin-bottom: 16px; }
  .pdf-drop:hover, .pdf-drop.dragging { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
  .pdf-drop.loading { border-color: var(--accent); animation: pulse 1.5s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }
  .debt-alert { background: rgba(226,6,19,0.08); border: 1px solid rgba(226,6,19,0.3); border-radius: 8px; padding: 10px 14px; display: flex; align-items: center; gap: 10px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #E20613; margin-bottom: 8px; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }
  @media (max-width: 768px) { .kpis { grid-template-columns: 1fr 1fr; } .form-grid { grid-template-columns: 1fr; } .main { padding: 16px; } .form-group.full { grid-column: auto; } }

  /* ── Mobile ── */
  @media (max-width: 640px) {
    .header { padding: 0 10px; height: 48px; }
    .logo { gap: 7px; }
    .logo svg { width: 26px !important; height: auto !important; }
    .logo-text { font-size: 13px; white-space: nowrap; }
    .logo-sub { display: none; }
    .header-save { display: none; }
    .theme-toggle { padding: 2px; }
    .theme-opt { padding: 4px 9px; font-size: 11px; }
    .nav { padding: 0 6px; overflow-x: auto; }
    .nav-btn { padding: 9px 10px; font-size: 12px; white-space: nowrap; }
    .dash-top { padding: 12px 12px 0; }
    .dash-body { padding: 0 12px 16px; }
    .tab-scroll { padding: 12px; }
    .kpis { grid-template-columns: 1fr 1fr; gap: 8px; }
    .kpi { padding: 12px 12px; }
    .kpi-value { font-size: 22px; }
    .kpi-label { font-size: 9px; }
    .section-header { flex-direction: column; align-items: flex-start; gap: 8px; }
    .section-header > div:last-child { display: flex; gap: 6px; width: 100%; }
    .section-header .btn { flex: 1; justify-content: center; font-size: 11px; padding: 8px 6px; }
    .search-bar { gap: 6px; }
    .search-input { min-width: 0; font-size: 12px; padding: 8px 10px; }
    .filter-select { font-size: 12px; padding: 8px 8px; width: 100%; }
    table { font-size: 11px; }
    th, td { padding: 6px 7px; }
    .modal { padding: 16px; max-width: 100%; margin: 0; border-radius: 8px; }
    .modal-title { font-size: 15px; }
    .form-grid { grid-template-columns: 1fr; }
    .form-group.full { grid-column: auto; }
    .btn { font-size: 12px; padding: 8px 12px; }
  }
  </style>
</head>

  "apikey": SUPABASE_KEY,
  "Authorization": "Bearer " + SUPABASE_KEY,
  "Prefer": "return=minimal"
};

// ─── Timestamp del último dato cargado/guardado ────────────────────────────
// Permite que el polling detecte cambios de OTROS usuarios sin sobreescribir
// los cambios del usuario actual.
let _lastUpdatedAt = null;
let _isSaving = false;

async function loadData() {
  try {
    const res = await fetch(
      SUPABASE_URL + "/rest/v1/app_state?id=eq.main&select=data,updated_at",
      { headers: { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY } }
    );
    if (res.ok) {
      const rows = await res.json();
      if (rows.length > 0 && rows[0].data) {
        _lastUpdatedAt = rows[0].updated_at;
        const parsed = rows[0].data;
        if (!parsed.prestamos) parsed.prestamos = [];
        // Solo sembrar si la BD está completamente vacía (primer uso real)
        if (!parsed.custodias) parsed.custodias = [];
        if (!parsed.entregas)  parsed.entregas  = [];
        if (parsed.custodias.length === 0 && parsed.entregas.length === 0) {
          const seeded = { ...SEED_DATA, prestamos: [] };
          await saveData(seeded);
          return seeded;
        }
        return parsed;
      }
    }
  } catch (e) { console.error("Error cargando datos:", e); }
  return { ...SEED_DATA, prestamos: [] };
}

async function saveData(data) {
  _isSaving = true;
  try {
    const res = await fetch(SUPABASE_URL + "/rest/v1/app_state?id=eq.main", {
      method: "PATCH",
      headers: { ...SB_HEADERS, "Prefer": "return=representation" },
      body: JSON.stringify({ data: data, updated_at: new Date().toISOString() })
    });
    if (res.ok) {
      const rows = await res.json();
      // Actualizar el timestamp con el que devuelve el servidor
      if (rows && rows.length > 0 && rows[0].updated_at) {
        _lastUpdatedAt = rows[0].updated_at;
      }
    }
  } catch (e) { console.error("Error guardando:", e); }
  _isSaving = false;
}

// Polling inteligente: solo actualiza si el dato cambió en el servidor
// (por otro usuario) y no hay un guardado en curso
async function pollRemote(setData) {
  if (_isSaving) return;
  try {
    const res = await fetch(
      SUPABASE_URL + "/rest/v1/app_state?id=eq.main&select=data,updated_at",
      { headers: { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY } }
    );
    if (!res.ok) return;
    const rows = await res.json();
    if (!rows.length) return;
    const remoteTs = rows[0].updated_at;
    if (remoteTs !== _lastUpdatedAt) {
      // Dato más reciente de otro usuario → actualizar
      _lastUpdatedAt = remoteTs;
      const parsed = rows[0].data;
      if (!parsed.prestamos) parsed.prestamos = [];
      setData(parsed);
    }
  } catch (_) { /* ignorar errores de red en polling */ }
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2);
}

function fmt(dateStr) {
  if (!dateStr || dateStr === "CONTINUACION" || dateStr === "FERIA") return "—";
  try {
    const d = new Date(dateStr);
    if (isNaN(d.getTime())) return dateStr;
    return d.toLocaleDateString("es-ES", { day: "2-digit", month: "2-digit", year: "numeric" });
  } catch { return dateStr; }
}

function fmtNow() {
  return new Date().toLocaleDateString("es-ES", { day: "2-digit", month: "2-digit", year: "numeric" });
}

// ─── STOCK BAR ───────────────────────────────────────────────────────────────
function StockBar({ entregadas, totales }) {
  const pct = totales > 0 ? Math.min(100, Math.round((entregadas / totales) * 100)) : 0;
  const pendientes = totales - entregadas;
  const color = pendientes <= 0 ? "#4caf7d" : pct >= 70 ? "#E20613" : "#002D5A";
  return (
    <div className="stock-bar-wrap">
      <div className="stock-bar-track">
        <div className="stock-bar-fill" style={{ width: `${pct}%`, background: color }} />
      </div>
      <div className="stock-pct">{pendientes} restantes</div>
    </div>
  );
}

function StatusTag({ entregadas, totales }) {
  const pendientes = totales - entregadas;
  if (pendientes <= 0) return <span className="tag tag-green">COMPLETO</span>;
  if (pendientes <= totales * 0.15) return <span className="tag tag-accent">CASI AGOTADO</span>;
  return <span className="tag tag-blue">EN CUSTODIA</span>;
}

function ModalNuevaCustodia({ onClose, onSave, clientes }) {
  const [form, setForm] = useState({
    cliente: "", albaran: "", facturaLibre: "", promSkrit: "",
    fecha: new Date().toISOString().split("T")[0],
    referencia: "", producto: "", almacen: "CENTRAL", udsTotales: "", notas: ""
  });
  const [dragging, setDragging] = useState(false);
  const [pdfLoading, setPdfLoading] = useState(false);
  const [pdfMsg, setPdfMsg] = useState("");
  const fileRef = useRef();
  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));

  const handleDrop = async (e) => {
    e.preventDefault();
    setDragging(false);
    const file = e.dataTransfer?.files?.[0] || e.target?.files?.[0];
    if (!file || file.type !== "application/pdf") { setPdfMsg("Solo se aceptan archivos PDF"); return; }
    setPdfLoading(true);
    setPdfMsg("Analizando albarán con IA...");
    try {
      const extracted = await extractAlbaranFromPDF(file);
      setForm(f => ({
        ...f,
        cliente: extracted.cliente || f.cliente,
        albaran: extracted.albaran || f.albaran,
        fecha: extracted.fecha || f.fecha,
        referencia: extracted.referencia || f.referencia,
        producto: extracted.producto || f.producto,
        udsTotales: extracted.udsTotales || f.udsTotales,
        almacen: extracted.almacen || f.almacen,
        notas: extracted.notas || f.notas,
      }));
      setPdfMsg("✓ Datos extraídos correctamente. Revisa y ajusta si es necesario.");
    } catch {
      setPdfMsg("No se pudo extraer la información. Rellena el formulario manualmente.");
    }
    setPdfLoading(false);
  };

  const handleSave = () => {
    if (!form.cliente || !form.referencia || !form.udsTotales) {
      alert("Rellena al menos: Cliente, Referencia y Unidades totales"); return;
    }
    onSave({ ...form, udsTotales: Number(form.udsTotales), id: uid(), udsEntregadas: 0 });
  };

  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal">
        <div className="modal-title">📦 Nueva Custodia</div>
        <div className="modal-sub">Registra un nuevo lote de stock en custodia para un cliente</div>

        <div
          className={`pdf-drop ${dragging ? "dragging" : ""} ${pdfLoading ? "loading" : ""}`}
          onDragOver={e => { e.preventDefault(); setDragging(true); }}
          onDragLeave={() => setDragging(false)}
          onDrop={handleDrop}
          onClick={() => fileRef.current?.click()}
        >
          <input ref={fileRef} type="file" accept="application/pdf" style={{ display: "none" }} onChange={handleDrop} />
          {pdfLoading ? "⏳ Procesando PDF con IA..." : "📄 Arrastra el albarán en PDF aquí o haz clic para seleccionar"}
          {pdfMsg && <div style={{ marginTop: 6, fontSize: 11 }}>{pdfMsg}</div>}
        </div>

        <div className="form-grid">
          <div className="form-group">
            <label>Cliente *</label>
            <input list="cl-list" value={form.cliente} onChange={e => set("cliente", e.target.value)} placeholder="Nombre del cliente" />
            <datalist id="cl-list">{clientes.map(c => <option key={c} value={c} />)}</datalist>
          </div>
          <div className="form-group">
            <label>Fecha de compra</label>
            <input type="date" value={form.fecha} onChange={e => set("fecha", e.target.value)} />
          </div>
          <div className="form-group">
            <label>Nº Albarán / Factura Libre</label>
            <input value={form.albaran} onChange={e => set("albaran", e.target.value)} placeholder="Ej: 177931" />
          </div>

  const [form, setForm] = useState({ uds: "", albaran: "", operario: "", notas: "", fecha: new Date().toISOString().split("T")[0] });

  const handleSave = () => {
    const uds = Number(form.uds);
    if (!uds || uds <= 0) { alert("Introduce las unidades a entregar"); return; }

// ─── MODAL PRÉSTAMO TEMPORAL ──────────────────────────────────────────────────
function ModalPrestamo({ custodia, onClose, onSave }) {
  const disponibles = custodia.udsTotales - custodia.udsEntregadas;
  const [form, setForm] = useState({ uds: "", clienteDeutor: "", motivo: "", fecha: new Date().toISOString().split("T")[0] });
  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));

  const handleSave = () => {
    const uds = Number(form.uds);
    if (!uds || uds <= 0) { alert("Introduce las unidades a tomar prestadas"); return; }
    if (uds > disponibles) { alert(`Solo hay ${disponibles} unidades disponibles`); return; }
    if (!form.clienteDeutor) { alert("Indica a quién se destinan las unidades"); return; }
    onSave({ ...form, uds, id: uid(), custodiaId: custodia.id, saldado: false });
  };

  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>

        <div className="modal-title">⚠️ Préstamo Temporal de Custodia</div>

        <div className="alert alert-warn">
          <strong>⚠️ Esto crea una deuda visible.</strong> Las unidades se marcan como utilizadas pero queda pendiente la reposición al cliente <strong>{custodia.cliente}</strong>.
        </div>
        <div className="form-grid">
          <div className="form-group">
            <label>Unidades a tomar *</label>
            <input type="number" min="1" max={disponibles} value={form.uds} onChange={e => set("uds", e.target.value)} placeholder={`Máx: ${disponibles}`} autoFocus />
          </div>
          <div className="form-group">
            <label>Fecha</label>
            <input type="date" value={form.fecha} onChange={e => set("fecha", e.target.value)} />
          </div>
          <div className="form-group full">
            <label>Destinado a (cliente / pedido urgente) *</label>
            <input value={form.clienteDeutor} onChange={e => set("clienteDeutor", e.target.value)} placeholder="¿Para quién o qué se usan?" />
          </div>
          <div className="form-group full">
            <label>Motivo</label>
            <textarea value={form.motivo} onChange={e => set("motivo", e.target.value)} placeholder="Explicación del préstamo..." style={{ minHeight: 60 }} />
          </div>
        </div>
        <div className="form-actions">
          <button className="btn btn-ghost" onClick={onClose}>Cancelar</button>
          <button className="btn" style={{ background: "#ff8c00", color: "#fff" }} onClick={handleSave}>⚠️ Registrar préstamo</button>
        </div>
      </div>
    </div>
  );
}

</div>
<div class="section">

// ─── MODAL NUEVA ENTREGA (multi-producto) ─────────────────────────────────────
function ModalNuevaEntrega({ data, onClose, onSave }) {
  const [step, setStep] = useState(1);
  const [clienteSeleccionado, setClienteSeleccionado] = useState("");
  const [cantidades, setCantidades] = useState({});
  const [operario, setOperario] = useState("");
  const [albaranSalida, setAlbaranSalida] = useState("");
  const [fecha, setFecha] = useState(new Date().toISOString().split("T")[0]);

  // Clientes con stock activo
  const clientesActivos = [...new Set(
    data.custodias
      .filter(c => c.udsTotales - c.udsEntregadas > 0)
      .map(c => c.cliente)
  )].sort();

  // Custodias activas del cliente seleccionado
  const custodiasCliente = data.custodias.filter(
    c => c.cliente === clienteSeleccionado && c.udsTotales - c.udsEntregadas > 0
  );

  const setCantidad = (id, val) => setCantidades(prev => ({ ...prev, [id]: val }));

  // Líneas con unidades > 0
  const lineasValidas = custodiasCliente.filter(c => {
    const v = Number(cantidades[c.id]);
    return v > 0 && v <= c.udsTotales - c.udsEntregadas;
  });

  const totalUds = lineasValidas.reduce((s, c) => s + Number(cantidades[c.id]), 0);

  const handleConfirm = () => {
    if (lineasValidas.length === 0) { alert("Introduce al menos una cantidad válida"); return; }
    const entregas = lineasValidas.map(c => ({
      id: uid(), custodiaId: c.id,
      fecha, uds: Number(cantidades[c.id]),
      albaran: albaranSalida, operario,
      notas: "Entrega múltiple"
    }));
    onSave(entregas, clienteSeleccionado, albaranSalida, operario);
    printMultiDeliveryDoc(
      clienteSeleccionado,
      lineasValidas.map(c => ({ custodiaId: c.id, uds: Number(cantidades[c.id]) })),
      data.custodias, operario, albaranSalida
    );
  };

  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal" style={{ maxWidth: 700 }}>
        <div className="modal-title">🟢 Nueva Entrega</div>
        <div className="modal-sub">Registra la entrega de uno o varios productos a un cliente</div>

        {/* STEP INDICATOR */}
        <div style={{ display: "flex", gap: 8, marginBottom: 24 }}>
          {[{ n: 1, label: "Cliente" }, { n: 2, label: "Productos" }, { n: 3, label: "Confirmar" }].map(s => (
            <div key={s.n} style={{ display: "flex", alignItems: "center", gap: 6 }}>
              <div style={{
                width: 26, height: 26, borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center",
                background: step >= s.n ? "var(--green)" : "var(--surface2)",
                color: step >= s.n ? "#fff" : "var(--text-dim)",
                fontFamily: "var(--mono, monospace)", fontSize: 12, fontWeight: 700,
                border: `2px solid ${step >= s.n ? "var(--green)" : "var(--border)"}`,
                transition: "all 0.2s"
              }}>{s.n}</div>
              <span style={{ fontSize: 12, fontWeight: 600, color: step >= s.n ? "var(--text)" : "var(--text-dim)" }}>{s.label}</span>
              {s.n < 3 && <span style={{ color: "var(--text-faint)", fontSize: 14 }}>›</span>}
            </div>
          ))}
        </div>

        {/* STEP 1: SELECT CLIENT */}
        {step === 1 && (
          <div>
            <div className="form-group" style={{ marginBottom: 20 }}>
              <label>Cliente *</label>
              <select value={clienteSeleccionado} onChange={e => { setClienteSeleccionado(e.target.value); setCantidades({}); }}
                style={{ fontSize: 14, padding: "12px 14px" }}>
                <option value="">— Selecciona un cliente —</option>
                {clientesActivos.map(c => <option key={c} value={c}>{c}</option>)}
              </select>
            </div>
            {clienteSeleccionado && (
              <div className="alert alert-info">
                {custodiasCliente.length} línea{custodiasCliente.length !== 1 ? "s" : ""} de producto activa{custodiasCliente.length !== 1 ? "s" : ""} para <strong>{clienteSeleccionado}</strong>
              </div>
            )}
            <div className="form-actions">
              <button className="btn btn-ghost" onClick={onClose}>Cancelar</button>
              <button className="btn btn-green" onClick={() => setStep(2)} disabled={!clienteSeleccionado}
                style={{ opacity: clienteSeleccionado ? 1 : 0.4 }}>
                Seleccionar productos →
              </button>
            </div>
          </div>
        )}

        {/* STEP 2: QUANTITIES */}
        {step === 2 && (
          <div>
            <div style={{ marginBottom: 14, fontFamily: "var(--mono,monospace)", fontSize: 12, color: "var(--text-dim)" }}>
              Cliente: <strong style={{ color: "var(--text)" }}>{clienteSeleccionado}</strong> · Indica las unidades a entregar de cada producto (deja en 0 los que no se entregan)
            </div>
            <div style={{ border: "1px solid var(--border)", borderRadius: 8, overflow: "hidden", marginBottom: 16 }}>
              <table style={{ width: "100%", borderCollapse: "collapse", fontFamily: "var(--mono,monospace)", fontSize: 12 }}>
                <thead>
                  <tr>
                    <th style={{ background: "var(--surface2)", padding: "8px 12px", textAlign: "left", fontSize: 10, textTransform: "uppercase", letterSpacing: "0.8px", color: "var(--text-dim)", borderBottom: "1px solid var(--border)" }}>Referencia</th>
                    <th style={{ background: "var(--surface2)", padding: "8px 12px", textAlign: "left", fontSize: 10, textTransform: "uppercase", letterSpacing: "0.8px", color: "var(--text-dim)", borderBottom: "1px solid var(--border)" }}>Producto</th>
                    <th style={{ background: "var(--surface2)", padding: "8px 12px", textAlign: "center", fontSize: 10, textTransform: "uppercase", letterSpacing: "0.8px", color: "var(--text-dim)", borderBottom: "1px solid var(--border)" }}>Disponibles</th>
                    <th style={{ background: "var(--surface2)", padding: "8px 12px", textAlign: "center", fontSize: 10, textTransform: "uppercase", letterSpacing: "0.8px", color: "var(--text-dim)", borderBottom: "1px solid var(--border)" }}>A entregar</th>
                  </tr>
                </thead>
                <tbody>
                  {custodiasCliente.map((c, i) => {
                    const disponibles = c.udsTotales - c.udsEntregadas;
                    const val = cantidades[c.id] || "";
                    const numVal = Number(val);
                    const isOver = numVal > disponibles;
                    const isActive = numVal > 0 && !isOver;
                    return (
                      <tr key={c.id} style={{ background: isActive ? "rgba(26,127,75,0.06)" : i % 2 === 1 ? "var(--surface2)" : "transparent" }}>
                        <td style={{ padding: "10px 12px", borderBottom: "1px solid var(--border)" }}>
                          <span className="tag tag-blue">{c.referencia}</span>
                        </td>
                        <td style={{ padding: "10px 12px", borderBottom: "1px solid var(--border)", maxWidth: 200, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{c.producto}</td>
                        <td style={{ padding: "10px 12px", borderBottom: "1px solid var(--border)", textAlign: "center", fontWeight: 700, color: "var(--accent)" }}>{disponibles}</td>
                        <td style={{ padding: "6px 12px", borderBottom: "1px solid var(--border)", textAlign: "center" }}>
                          <input
                            type="number" min="0" max={disponibles}
                            value={val}
                            onChange={e => setCantidad(c.id, e.target.value)}
                            style={{
                              width: 80, textAlign: "center", padding: "6px 8px",
                              border: `2px solid ${isOver ? "#E20613" : isActive ? "var(--green)" : "var(--border)"}`,
                              borderRadius: 6, background: "var(--surface2)", color: "var(--text)",
                              fontFamily: "var(--mono,monospace)", fontSize: 13, fontWeight: 700,
                            }}
                            placeholder="0"
                          />
                          {isOver && <div style={{ fontSize: 10, color: "#E20613", marginTop: 2 }}>máx {disponibles}</div>}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
            {totalUds > 0 && (
              <div className="alert alert-info" style={{ marginBottom: 14 }}>
                ✓ <strong>{lineasValidas.length} producto{lineasValidas.length !== 1 ? "s" : ""}</strong> seleccionado{lineasValidas.length !== 1 ? "s" : ""} · <strong>{totalUds} unidades</strong> en total
              </div>
            )}
            <div className="form-actions">
              <button className="btn btn-ghost" onClick={() => setStep(1)}>← Volver</button>
              <button className="btn btn-green" onClick={() => setStep(3)} disabled={lineasValidas.length === 0}
                style={{ opacity: lineasValidas.length > 0 ? 1 : 0.4 }}>
                Confirmar selección →
              </button>
            </div>
          </div>
        )}

        {/* STEP 3: CONFIRM */}
        {step === 3 && (
          <div>
            <div style={{ marginBottom: 16, background: "rgba(26,127,75,0.08)", border: "1px solid rgba(26,127,75,0.3)", borderRadius: 8, padding: "12px 16px" }}>
              <div style={{ fontFamily: "var(--mono,monospace)", fontSize: 12, color: "var(--green)", marginBottom: 8, fontWeight: 700 }}>
                Resumen de entrega · {clienteSeleccionado}
              </div>
              {lineasValidas.map(c => (
                <div key={c.id} style={{ fontFamily: "var(--mono,monospace)", fontSize: 12, display: "flex", justifyContent: "space-between", padding: "3px 0", borderBottom: "1px solid rgba(26,127,75,0.15)" }}>
                  <span>{c.referencia} · {c.producto}</span>
                  <strong style={{ color: "var(--green)" }}>{cantidades[c.id]} ud.</strong>
                </div>
              ))}
              <div style={{ fontFamily: "var(--mono,monospace)", fontSize: 13, display: "flex", justifyContent: "space-between", marginTop: 8, fontWeight: 700 }}>
                <span>TOTAL</span>
                <span style={{ color: "var(--green)" }}>{totalUds} unidades</span>
              </div>
            </div>
            <div className="form-grid">
              <div className="form-group">
                <label>Fecha de entrega</label>
                <input type="date" value={fecha} onChange={e => setFecha(e.target.value)} />
              </div>
              <div className="form-group">
                <label>Nº Albarán de salida</label>
                <input value={albaranSalida} onChange={e => setAlbaranSalida(e.target.value)} placeholder="Opcional" />
              </div>
              <div className="form-group full">
                <label>Operario que entrega</label>
                <input value={operario} onChange={e => setOperario(e.target.value)} placeholder="Nombre del operario" />
              </div>
            </div>
            <div style={{ fontFamily: "var(--mono,monospace)", fontSize: 11, color: "var(--text-dim)", background: "var(--accent-dim)", padding: "8px 12px", borderRadius: 6, marginTop: 12, marginBottom: 0 }}>
              ℹ️ Al confirmar se guardará la entrega y se generará el documento para imprimir.
            </div>
            <div className="form-actions">
              <button className="btn btn-ghost" onClick={() => setStep(2)}>← Volver</button>
              <button className="btn btn-green" onClick={handleConfirm}>✓ Confirmar y generar documento</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ─── MODAL CONFIRMACIÓN ──────────────────────────────────────────────────────
function ModalConfirmar({ titulo, mensaje, detalles, tipo = "danger", labelConfirm = "Confirmar", onConfirm, onClose }) {
  const colors = tipo === "danger"
    ? { bg: "rgba(226,6,19,0.08)", border: "rgba(226,6,19,0.3)", btn: "#E20613", icon: "🗑️" }
    : { bg: "rgba(255,140,0,0.08)", border: "rgba(255,140,0,0.3)", btn: "#ff8c00", icon: "⚠️" };
  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal" style={{ maxWidth: 460 }}>
        <div style={{ textAlign: "center", marginBottom: 20 }}>
          <div style={{ fontSize: 40, marginBottom: 10 }}>{colors.icon}</div>
          <div className="modal-title" style={{ fontSize: 16 }}>{titulo}</div>
        </div>
        <div style={{ background: colors.bg, border: `1px solid ${colors.border}`, borderRadius: 8, padding: "14px 16px", marginBottom: 16, fontFamily: "var(--mono,monospace)", fontSize: 12, color: "var(--text)" }}>
          {mensaje}
          {detalles && (
            <div style={{ marginTop: 10, paddingTop: 10, borderTop: `1px solid ${colors.border}`, color: "var(--text-dim)" }}>
              {detalles}
            </div>
          )}
        </div>
        <div style={{ fontFamily: "var(--mono,monospace)", fontSize: 11, color: "var(--text-dim)", textAlign: "center", marginBottom: 20 }}>
          Esta acción no se puede deshacer.
        </div>
        <div className="form-actions" style={{ justifyContent: "center", gap: 16 }}>
          <button className="btn btn-ghost" style={{ minWidth: 120 }} onClick={onClose}>Cancelar</button>
          <button className="btn" style={{ background: colors.btn, color: "#fff", minWidth: 140 }} onClick={onConfirm}>{labelConfirm}</button>
        </div>
      </div>
    </div>
  );
}

// ─── MODAL EDITAR CUSTODIA ────────────────────────────────────────────────────
function ModalEditarCustodia({ custodia, onClose, onSave, clientes }) {
  const [form, setForm] = useState({ ...custodia });
  const [confirmando, setConfirmando] = useState(false);
  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));

  const handleGuardar = () => {
    if (!form.cliente || !form.referencia || !form.udsTotales) {
      alert("Rellena al menos: Cliente, Referencia y Unidades totales"); return;
    }
    if (Number(form.udsEntregadas) > Number(form.udsTotales)) {
      alert("Las unidades entregadas no pueden superar las totales"); return;
    }
    setConfirmando(true);
  };

  if (confirmando) return (
    <ModalConfirmar
      titulo="¿Confirmar cambios?"
      tipo="warn"
      labelConfirm="✓ Guardar cambios"
      mensaje={`Vas a modificar la custodia de ${custodia.cliente} · ${custodia.referencia}`}
      detalles={`Cambios en: cliente, albarán, referencia, producto, almacén, unidades u otros campos. Revisa que todo sea correcto antes de guardar.`}
      onConfirm={() => onSave({ ...form, udsTotales: Number(form.udsTotales), udsEntregadas: Number(form.udsEntregadas) })}
      onClose={() => setConfirmando(false)}
    />
  );

  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal">
        <div className="modal-title">✏️ Editar Custodia</div>
        <div className="modal-sub">Modifica los datos de esta custodia · Los cambios se guardan en la nube</div>
        <div className="alert" style={{ background: "rgba(255,140,0,0.08)", border: "1px solid rgba(255,140,0,0.25)", color: "#ff8c00", marginBottom: 20 }}>

        <div className="form-grid">
          <div className="form-group">
            <label>Cliente *</label>
            <input list="cl-edit-list" value={form.cliente} onChange={e => set("cliente", e.target.value)} />

          </div>
          <div className="form-group">
            <label>Fecha de compra</label>
            <input type="date" value={form.fecha?.match(/^\d{4}-\d{2}-\d{2}$/) ? form.fecha : ""} onChange={e => set("fecha", e.target.value)} />
          </div>
          <div className="form-group">
            <label>Nº Albarán</label>
            <input value={form.albaran || ""} onChange={e => set("albaran", e.target.value)} />
          </div>
          <div className="form-group">
            <label>Nº Promoción Skrit</label>
            <input value={form.promSkrit || ""} onChange={e => set("promSkrit", e.target.value)} />
          </div>
          <div className="form-group">
            <label>Referencia *</label>
            <input value={form.referencia} onChange={e => set("referencia", e.target.value)} />
          </div>
          <div className="form-group">
            <label>Unidades totales *</label>
            <input type="number" min="0" value={form.udsTotales} onChange={e => set("udsTotales", e.target.value)} />
          </div>
          <div className="form-group full">
            <label>Descripción del producto</label>
            <input value={form.producto || ""} onChange={e => set("producto", e.target.value)} />
          </div>
          <div className="form-group">
            <label>Almacén</label>
            <select value={form.almacen} onChange={e => set("almacen", e.target.value)}>
              <option>CENTRAL</option><option>MONTECRISTO</option><option>EXTERNO</option>
            </select>
          </div>
          <div className="form-group">
            <label>Uds. ya entregadas</label>
            <input type="number" min="0" value={form.udsEntregadas} onChange={e => set("udsEntregadas", e.target.value)} />
          </div>
          <div className="form-group full">
            <label>Notas</label>
            <input value={form.notas || ""} onChange={e => set("notas", e.target.value)} placeholder="Observaciones..." />
          </div>
        </div>
        <div className="form-actions">
          <button className="btn btn-ghost" onClick={onClose}>Cancelar</button>
          <button className="btn" style={{ background: "#ff8c00", color: "#fff" }} onClick={handleGuardar}>✏️ Guardar cambios</button>
        </div>
      </div>
    </div>
  );
}

// ─── DASHBOARD ────────────────────────────────────────────────────────────────
function Dashboard({ data, onNuevaCustodia, onNuevaEntrega, onEntrega, onDelete, onEditar, onPrestamo, onSaldarDeuda }) {
  const [search, setSearch] = useState("");
  const [filterCliente, setFilterCliente] = useState("");
  const [filterAlmacen, setFilterAlmacen] = useState("");
  const [filterEstado, setFilterEstado] = useState("");
  const [filterAlbaran, setFilterAlbaran] = useState("");
  const [filterYear, setFilterYear] = useState("");

  const clientes = [...new Set(data.custodias.map(c => c.cliente))].sort();
  const almacenes = [...new Set(data.custodias.map(c => c.almacen).filter(a => a && a !== "CONTINUACION"))].sort();
  const years = [...new Set(
    data.custodias.map(c => c.fecha?.match(/^(\d{4})/)?.[1]).filter(Boolean)
  )].sort().reverse();

  // Map prestamos to custodias
  const custodiaDeudas = {};
  (data.prestamos || []).filter(p => !p.saldado).forEach(p => {
    if (!custodiaDeudas[p.custodiaId]) custodiaDeudas[p.custodiaId] = [];
    custodiaDeudas[p.custodiaId].push(p);
  });

  const ningunoSeleccionado = !filterCliente;

  const filtered = ningunoSeleccionado ? [] : data.custodias.filter(c => {
    const pendientes = c.udsTotales - c.udsEntregadas;
    if (filterEstado === "ACTIVAS" && pendientes <= 0) return false;
    if (filterEstado === "COMPLETAS" && pendientes > 0) return false;
    if (filterCliente && c.cliente !== filterCliente) return false;
    if (filterAlmacen && c.almacen !== filterAlmacen) return false;
    if (filterAlbaran && !(c.albaran || "").toLowerCase().includes(filterAlbaran.toLowerCase())) return false;
    if (filterYear && !(c.fecha || "").startsWith(filterYear)) return false;
    const q = search.toLowerCase();
    if (q && !`${c.cliente} ${c.referencia} ${c.producto} ${c.albaran}`.toLowerCase().includes(q)) return false;
    return true;
  });

  const totalUds = data.custodias.reduce((s, c) => s + c.udsTotales, 0);
  const entregadasUds = data.custodias.reduce((s, c) => s + c.udsEntregadas, 0);
  const activasCnt = data.custodias.filter(c => c.udsTotales - c.udsEntregadas > 0).length;
  const clientesCnt = new Set(data.custodias.map(c => c.cliente)).size;
  const deudasActivas = (data.prestamos || []).filter(p => !p.saldado);

  return (
    <div style={{ display: "flex", flexDirection: "column", flex: 1, overflow: "hidden" }}>
      <div className="dash-top">
      {deudasActivas.length > 0 && (
        <div style={{ marginBottom: 16 }}>
          {deudasActivas.map(p => {
            const cust = data.custodias.find(c => c.id === p.custodiaId);
            return (
              <div key={p.id} className="debt-alert">
                <span>⚠️</span>
                <span style={{ flex: 1 }}>
                  <strong>DEUDA ACTIVA:</strong> {p.uds} ud. de {cust?.referencia || "ref. desconocida"} tomadas de la custodia de <strong>{cust?.cliente}</strong> para {p.clienteDeutor} el {fmt(p.fecha)}
                  {p.motivo && ` · ${p.motivo}`}
                </span>
                <button className="btn btn-sm btn-ghost" onClick={() => onSaldarDeuda(p.id)}>✓ Saldar</button>
              </div>
            );
          })}
        </div>
      )}

      <div className="kpis">
        <div className="kpi">
          <div className="kpi-label">Custodias activas</div>
          <div className="kpi-value green">{activasCnt}</div>
          <div className="kpi-sub">de {data.custodias.length} total</div>
        </div>
        <div className="kpi">
          <div className="kpi-label">Clientes con stock</div>
          <div className="kpi-value">{clientesCnt}</div>
          <div className="kpi-sub">clientes distintos</div>
        </div>
        <div className="kpi">
          <div className="kpi-label">Unidades en almacén</div>
          <div className="kpi-value green">{totalUds - entregadasUds}</div>
          <div className="kpi-sub">pendientes de entrega</div>
        </div>
        <div className="kpi">
          <div className="kpi-label">Deudas activas</div>
          <div className={`kpi-value ${deudasActivas.length > 0 ? "debt-alert" : "green"}`}>{deudasActivas.length}</div>
          <div className="kpi-sub">{data.entregas.length} entregas totales</div>
        </div>
      </div>

      <div className="section-header" style={{ marginTop: 16 }}>
        <div>
          <div className="section-title">Stock en custodia</div>
          <div className="section-sub">{ningunoSeleccionado ? "Usa los filtros para consultar el stock" : `${filtered.length} registros mostrados`}</div>
        </div>
        <div style={{ display: "flex", gap: 10 }}>
          <button className="btn btn-primary" onClick={onNuevaCustodia}>+ Nueva custodia</button>
          <button className="btn btn-green" onClick={onNuevaEntrega}>🚚 Nueva entrega</button>
        </div>
      </div>

      <div className="search-bar" style={{ marginBottom: 0, paddingBottom: 12 }}>
        <input className="search-input" placeholder="🔍  Buscar por cliente, referencia, producto..." value={search} onChange={e => setSearch(e.target.value)} />
        <input className="search-input" style={{ maxWidth: 130 }} placeholder="Nº Albarán" value={filterAlbaran} onChange={e => setFilterAlbaran(e.target.value)} />
        <input className="search-input" style={{ maxWidth: 80 }} placeholder="Año" type="number" min="2000" max="2099" value={filterYear} onChange={e => setFilterYear(e.target.value)} />
        <select className="filter-select" value={filterCliente} onChange={e => { const v = e.target.value; setFilterCliente(v); if (v && !filterEstado) setFilterEstado("ACTIVAS"); if (!v) setFilterEstado(""); }}>
          <option value="">— Cliente —</option>
          {clientes.map(c => <option key={c} value={c}>{c}</option>)}
        </select>
        <select className="filter-select" value={filterEstado} onChange={e => setFilterEstado(e.target.value)}>
          <option value="">— Estado —</option>
          <option value="ACTIVAS">Activas</option>
          <option value="TODAS">Todas</option>
          <option value="COMPLETAS">Completadas</option>
        </select>
      </div>
      </div>{/* end dash-top */}

      <div className="dash-body">
      {ningunoSeleccionado ? (
        <div className="empty">
          <div className="empty-icon">🔍</div>
          <div className="empty-title">Selecciona un filtro para consultar</div>
          <div className="empty-sub">Elige un cliente, almacén o estado — o busca por texto</div>
          <div className="krafted">Krafted by <span>Yakoba Moreno</span></div>
          <div className="krafted" style={{ marginTop: 6 }}>Designed in <span style={{ color: "#002D5A" }}>Claude Code</span></div>
          <div className="krafted" style={{ marginTop: 6, color: "var(--text-faint)" }}>Gestor de Stocks y Custodias <span style={{ color: "var(--text-dim)" }}>v.6</span></div>
        </div>
      ) : filtered.length === 0 ? (
        <div className="empty">
          <div className="empty-icon">📦</div>
          <div className="empty-title">Sin resultados</div>
          <div className="empty-sub">No hay custodias que coincidan con los filtros aplicados</div>
        </div>
      ) : (
        <div className="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Cliente</th><th>Albarán</th><th>Referencia</th><th>Producto</th>
                <th>Almacén</th><th>Compradas</th><th>Entregadas</th><th>Stock Actual</th>
                <th>Fecha</th><th>Acciones</th>
              </tr>
            </thead>
            <tbody>
              {filtered.map(c => {
                const pendientes = c.udsTotales - c.udsEntregadas;
                const deudas = custodiaDeudas[c.id] || [];
                return (
                  <tr key={c.id}>
                    <td style={{ fontWeight: 700 }}>
                      {c.cliente}
                      {deudas.length > 0 && <span className="tag tag-accent" style={{ marginLeft: 6 }}>⚠️ DEUDA</span>}
                    </td>
                    <td style={{ color: "var(--text-dim)" }}>{c.albaran || "—"}</td>
                    <td style={{ fontFamily: "var(--mono,monospace)", fontWeight: 700, color: "var(--text)" }}>{c.referencia}</td>
                    <td style={{ maxWidth: 280, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{c.producto}</td>
                    <td><span className="tag tag-accent">{c.almacen}</span></td>
                    <td style={{ textAlign: "right" }}>{c.udsTotales}</td>
                    <td style={{ textAlign: "right" }}>{c.udsEntregadas}</td>
                    <td style={{ fontFamily:"var(--mono,monospace)", fontWeight:700, color: pendientes>0 ? "var(--green)" : "var(--text-dim)", textAlign:"right" }}>{pendientes}</td>
                    <td style={{ color: "var(--text-dim)" }}>{fmt(c.fecha)}</td>
                    <td>
                      <div style={{ display: "flex", gap: 4, flexWrap: "wrap" }}>
                        {pendientes > 0 && (
                          <>
                            <button className="btn btn-ghost btn-sm" onClick={() => onEntrega(c)}>🚚 Entregar</button>
                            <button className="btn btn-sm" style={{ background: "rgba(255,140,0,0.12)", color: "#ff8c00", border: "1px solid rgba(255,140,0,0.3)" }} onClick={() => onPrestamo(c)} title="Tomar unidades prestadas temporalmente">⚠️</button>
                          </>
                        )}
                        <button className="btn btn-sm" style={{ background: "rgba(0,45,90,0.1)", color: "var(--blue2)", border: "1px solid rgba(0,45,90,0.2)" }} onClick={() => onEditar(c)} title="Editar custodia">✏️</button>
                        <button className="btn btn-danger btn-sm" onClick={() => onDelete(c)} title="Eliminar custodia">🗑️</button>
                      </div>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
      </div>{/* end dash-body */}
    </div>
  );
}

// ─── HISTORIAL DE MOVIMIENTOS ────────────────────────────────────────────────
function Historial({ data }) {
  const [search, setSearch] = useState("");

  // Combinar custodias (ENTRADA) y entregas (SALIDA) en un solo timeline
  const movimientos = [
    ...data.custodias.map(c => ({
      id: "c-" + c.id, tipo: "CUSTODIA",
      fecha: c.fecha || "", cliente: c.cliente,
      referencia: c.referencia, producto: c.producto,
      almacen: c.almacen, uds: c.udsTotales,
      operario: "Registro", albaran: c.albaran, notas: c.notas
    })),
    ...data.entregas.map(e => {
      const c = data.custodias.find(x => x.id === e.custodiaId) || {};
      return {
        id: "e-" + e.id, tipo: "ENTREGA",
        fecha: e.fecha || "", cliente: c.cliente || "Cliente eliminado",
        referencia: c.referencia, producto: c.producto,
        almacen: c.almacen, uds: e.uds,
        operario: e.operario, albaran: e.albaran, notas: e.notas
      };
    })
  ]
  .filter(m => {
    if (!search) return true;
    const q = search.toLowerCase();
    return `${m.cliente} ${m.referencia} ${m.producto} ${m.albaran} ${m.operario}`.toLowerCase().includes(q);
  })
  .sort((a, b) => {
    const da = a.fecha && a.fecha.match(/^\d{4}/) ? a.fecha : "1900";
    const db = b.fecha && b.fecha.match(/^\d{4}/) ? b.fecha : "1900";
    return db.localeCompare(da);
  });

  return (
    <div>
      <div className="section-header">
        <div>
          <div className="section-title">Historial de movimientos</div>
          <div className="section-sub">{movimientos.length} movimientos · {data.custodias.length} custodias · {data.entregas.length} entregas</div>
        </div>
      </div>
      <div className="search-bar">
        <input className="search-input" placeholder="🔍  Buscar por cliente, referencia, operario..." value={search} onChange={e => setSearch(e.target.value)} />
      </div>
      {movimientos.length === 0 ? (
        <div className="empty">
          <div className="empty-icon">📋</div>
          <div className="empty-title">Sin movimientos</div>
          <div className="empty-sub">Los movimientos aparecerán aquí</div>
        </div>
      ) : movimientos.map(m => (
        <div key={m.id} className="history-item">
          <div style={{ minWidth: 80 }}>
            <div style={{
              display: "inline-block", padding: "2px 8px", borderRadius: 4,
              fontFamily: "var(--mono,monospace)", fontSize: 10, fontWeight: 700,
              background: m.tipo === "CUSTODIA" ? "rgba(46,125,50,0.15)" : "rgba(226,6,19,0.12)",
              color: m.tipo === "CUSTODIA" ? "var(--green)" : "var(--accent)",
              marginBottom: 4
            }}>{m.tipo}</div>
            <div className="history-date">{fmt(m.fecha)}</div>
            {m.operario && m.operario !== "Importado" && m.operario !== "Registro" &&
              <div style={{ fontSize: 10, color: "var(--text-faint)", marginTop: 3 }}>{m.operario}</div>}
            {(m.operario === "Importado" || m.operario === "Registro") &&
              <div style={{ fontSize: 10, color: "var(--text-faint)", marginTop: 3, fontStyle: "italic" }}>histórico</div>}
          </div>
          <div className="history-body">
            <div className="history-client">{m.cliente}</div>
            <div className="history-product">
              {m.referencia} · {m.producto}
              {m.albaran && <> · Alb. <span style={{ color: "var(--accent)" }}>{m.albaran}</span></>}
              {m.almacen && m.almacen !== "CONTINUACION" && <> · {m.almacen}</>}
            </div>
            {m.notas && m.notas !== "Histórico" && m.notas !== "Entrega múltiple" &&
              <div style={{ fontSize: 11, color: "var(--text-dim)", marginTop: 4 }}>📝 {m.notas}</div>}
          </div>
          <div style={{ textAlign: "right" }}>
            <div className="history-uds" style={{ color: m.tipo === "CUSTODIA" ? "var(--green)" : "var(--accent)" }}>{m.uds}</div>
            <div className="history-uds-label">UNIDADES</div>
          </div>
        </div>
      ))}
    </div>
  );
}

// ─── CLIENTES ─────────────────────────────────────────────────────────────────
function Clientes({ data }) {
  const [search, setSearch] = useState("");

  const map = {};
  data.custodias.forEach(c => {
    if (!map[c.cliente]) map[c.cliente] = { custodias: 0, pendientes: 0, almacenes: new Set() };
    map[c.cliente].custodias++;
    map[c.cliente].pendientes += c.udsTotales - c.udsEntregadas;
    if (c.almacen && c.almacen !== "CONTINUACION") map[c.cliente].almacenes.add(c.almacen);
  });

  const sorted = Object.entries(map)
    .filter(([cliente]) => !search || cliente.toLowerCase().includes(search.toLowerCase()))
    .sort((a, b) => b[1].custodias - a[1].custodias);

  return (
    <div>
      <div className="section-header">
        <div>
          <div className="section-title">Resumen por cliente</div>
          <div className="section-sub">{sorted.length} clientes con custodias</div>
        </div>
      </div>
      <div className="search-bar">
        <input className="search-input" placeholder="🔍  Buscar cliente..." value={search} onChange={e => setSearch(e.target.value)} />
      </div>
      {sorted.length === 0 ? (
        <div className="empty"><div className="empty-icon">👥</div><div className="empty-title">Sin clientes</div></div>
      ) : (
        <div className="table-wrap">
          <table>
            <thead><tr><th>Cliente</th><th>Nº Custodias</th><th>Uds. pendientes</th><th>Almacenes</th><th>Estado</th></tr></thead>
            <tbody>
              {sorted.map(([cliente, info]) => (
                <tr key={cliente}>
                  <td style={{ fontWeight: 700 }}>{cliente}</td>
                  <td>{info.custodias}</td>
                  <td style={{ fontFamily: "var(--mono, monospace)", fontWeight: 700, color: "var(--green)" }}>{info.pendientes}</td>
                  <td>{[...info.almacenes].map(a => <span key={a} className="tag tag-accent" style={{ marginRight: 4 }}>{a}</span>)}</td>
                  <td>{info.pendientes > 0 ? <span className="tag tag-green">ACTIVO</span> : <span style={{color:"var(--text-dim)",fontSize:11}}>COMPLETO</span>}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}


// ─── PRINT CUSTODIAS ─────────────────────────────────────────────────────────
function printCustodiasDoc(titulo, filas, allCustodias) {
  const date = fmtNow();
  const rows = filas.map(c => {
    const pend = c.udsTotales - c.udsEntregadas;
    return `<tr>
      <td>${c.cliente}</td>
      <td>${c.referencia}</td>
      <td>${c.producto}</td>
      <td>${c.almacen}</td>
      <td style="text-align:right">${c.udsTotales}</td>
      <td style="text-align:right">${c.udsEntregadas}</td>
      <td style="text-align:right;font-weight:bold;color:#1a7f4b">${pend}</td>
      <td>${fmt(c.fecha)}</td>
    </tr>`;
  }).join('');

  const totalPend = filas.reduce((s,c) => s + (c.udsTotales - c.udsEntregadas), 0);
  const html = `<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">
<title>${titulo}</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:Arial,sans-serif; font-size:11px; color:#002D5A; padding:20px; }

  .company { font-size:18px; font-weight:bold; }
  .doc-title { text-align:right; }
  .doc-title h2 { font-size:14px; color:#E20613; }
  table { width:100%; border-collapse:collapse; }
  th { background:#002D5A; color:#fff; padding:6px 8px; text-align:left; font-size:10px; }
  td { padding:5px 8px; border-bottom:1px solid #eee; }
  tr:nth-child(even) td { background:#f9f9f9; }
  .total-row td { border-top:2px solid #002D5A; font-weight:bold; }
  .footer { margin-top:20px; font-size:9px; color:#999; text-align:center; border-top:1px solid #ddd; padding-top:8px; }
  @media print { body { padding:8px; } }
</style></head><body>
<div class="header">
  <div><div class="company">RECAMBIOS IBIZA S.A.</div><div style="font-size:10px;color:#666">AD Parts Distribución</div></div>
  <div class="doc-title"><h2>${titulo}</h2><div style="font-size:10px;color:#666">Fecha: ${date}</div></div>
</div>
<table>
  <thead><tr><th>Cliente</th><th>Referencia</th><th>Producto</th><th>Almacén</th><th style="text-align:right">Compradas</th><th style="text-align:right">Entregadas</th><th style="text-align:right">Pendientes</th><th>Fecha compra</th></tr></thead>
  <tbody>
    ${rows}
    <tr class="total-row"><td colspan="6" style="text-align:right">TOTAL PENDIENTES</td><td style="text-align:right;color:#1a7f4b">${totalPend}</td><td></td></tr>
  </tbody>
</table>
<div class="footer">Recambios Ibiza S.A. · AD Parts Distribución · Generado automáticamente el ${date}</div>
</body></html>`;

  const win = window.open('', '_blank', 'width=900,height=700');
  win.document.write(html);
  win.document.close();
  setTimeout(() => win.print(), 500);
}

            <div style={{ display:"flex", gap:8 }}>
              <button className="btn btn-ghost" onClick={() => printCustodiasDoc(`Stock en custodia — ${filterCliente}`, porCliente)}>🖨️ Imprimir</button>
              <button className="btn btn-primary" onClick={() => printCustodiasDoc(`Stock en custodia — ${filterCliente}`, porCliente)}>📄 Crear PDF</button>
            </div>
          </div>
          <div className="table-wrap">
            <table>
              <thead><tr>
                <th>Referencia</th><th>Producto</th><th>Almacén</th>
                <th style={{textAlign:"right"}}>Compradas</th>
                <th style={{textAlign:"right"}}>Entregadas</th>
                <th style={{textAlign:"right"}}>Pendientes</th>
                <th>Fecha</th>
              </tr></thead>
              <tbody>
                {porCliente.map(c => {
                  const pend = c.udsTotales - c.udsEntregadas;
                  return (
                    <tr key={c.id}>
                      <td style={{fontFamily:"var(--mono,monospace)",fontWeight:700,color:"var(--text)"}}>{c.referencia}</td>
                      <td>{c.producto}</td>
                      <td><span className="tag tag-accent">{c.almacen}</span></td>
                      <td style={{textAlign:"right"}}>{c.udsTotales}</td>
                      <td style={{textAlign:"right"}}>{c.udsEntregadas}</td>
                      <td style={{textAlign:"right",fontWeight:700,color:"var(--green)"}}>{pend}</td>
                      <td style={{color:"var(--text-dim)"}}>{fmt(c.fecha)}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {/* Vista por REFERENCIA */}
      {filterRef && (
        <div>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12 }}>
            <div>
              <div className="section-title" style={{ fontSize:14 }}>Ref: {filterRef}</div>
              <div className="section-sub">
                {porRef.length > 0 ? porRef[0].producto : ""} · {porRef.length} clientes · <strong style={{color:"var(--green)"}}>{totalPorRef} uds. pendientes en total</strong>
              </div>
            </div>
            <div style={{ display:"flex", gap:8 }}>
              <button className="btn btn-ghost" onClick={() => printCustodiasDoc(`Stock custodiado — Ref. ${filterRef}`, porRef)}>🖨️ Imprimir</button>
              <button className="btn btn-primary" onClick={() => printCustodiasDoc(`Stock custodiado — Ref. ${filterRef}`, porRef)}>📄 Crear PDF</button>
            </div>
          </div>
          <div className="table-wrap">
            <table>
              <thead><tr>
                <th>Cliente</th><th>Almacén</th>
                <th style={{textAlign:"right"}}>Compradas</th>
                <th style={{textAlign:"right"}}>Entregadas</th>
                <th style={{textAlign:"right"}}>Pendientes</th>
                <th>Fecha</th>
              </tr></thead>
              <tbody>
                {porRef.map(c => {
                  const pend = c.udsTotales - c.udsEntregadas;
                  return (
                    <tr key={c.id}>
                      <td style={{fontWeight:700}}>{c.cliente}</td>
                      <td><span className="tag tag-accent">{c.almacen}</span></td>
                      <td style={{textAlign:"right"}}>{c.udsTotales}</td>
                      <td style={{textAlign:"right"}}>{c.udsEntregadas}</td>
                      <td style={{textAlign:"right",fontWeight:700,color:"var(--green)"}}>{pend}</td>
                      <td style={{color:"var(--text-dim)"}}>{fmt(c.fecha)}</td>
                    </tr>
                  );
                })}
                <tr style={{borderTop:"2px solid var(--border)"}}>
                  <td colSpan="4" style={{fontWeight:700,textAlign:"right",fontFamily:"var(--mono,monospace)",fontSize:11}}>TOTAL PENDIENTES</td>
                  <td style={{textAlign:"right",fontWeight:700,color:"var(--green)",fontFamily:"var(--mono,monospace)"}}>{totalPorRef}</td>
                  <td></td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      )}
    </div>
  );
}

// ─── APP ──────────────────────────────────────────────────────────────────────
function App() {
  const [data, setData] = useState(null);
  const [tab, setTab] = useState("dashboard");
  const [modal, setModal] = useState(null);
  const [selectedCustodia, setSelectedCustodia] = useState(null);
  const [prestamoTarget, setPrestamoTarget] = useState(null);
  const [showNuevaEntrega, setShowNuevaEntrega] = useState(false);
  const [editTarget, setEditTarget] = useState(null);
  const [deleteTarget, setDeleteTarget] = useState(null);
  const [saveStatus, setSaveStatus] = useState("saved");
  const [darkMode, setDarkMode] = useState(() => localStorage.getItem('ri-theme') !== 'light');
  useEffect(() => {
    document.documentElement.setAttribute('data-theme', darkMode ? 'dark' : 'light');
    localStorage.setItem('ri-theme', darkMode ? 'dark' : 'light');
  }, [darkMode]);

  useEffect(() => {
    loadData().then(d => setData(d));
    // Polling cada 10 segundos — solo actualiza si otro usuario cambió algo
    const interval = setInterval(() => pollRemote(setData), 10000);
    return () => clearInterval(interval);
  }, []);

  const persist = useCallback(async (newData) => {
    setSaveStatus("saving");
    await saveData(newData);
    setSaveStatus("saved");
  }, []);

  const clientes = data ? [...new Set(data.custodias.map(c => c.cliente))].sort() : [];

  const handleNuevaCustodia = (custodia) => {
    const nd = { ...data, custodias: [...data.custodias, custodia] };
    setData(nd); persist(nd); setModal(null);
  };

  const handleEntrega = (entregaData) => {
    const nc = data.custodias.map(c => c.id === entregaData.custodiaId ? { ...c, udsEntregadas: c.udsEntregadas + entregaData.uds } : c);
    const nd = { ...data, custodias: nc, entregas: [...data.entregas, entregaData] };
    setData(nd); persist(nd); setSelectedCustodia(null);
  };

  const handleNuevaEntrega = (entregas) => {
    let custodias = [...data.custodias];
    entregas.forEach(e => {
      custodias = custodias.map(c => c.id === e.custodiaId ? { ...c, udsEntregadas: c.udsEntregadas + e.uds } : c);
    });
    const nd = { ...data, custodias, entregas: [...data.entregas, ...entregas] };
    setData(nd); persist(nd); setShowNuevaEntrega(false);
  };

  const handlePrestamo = (prestamoData) => {
    // Préstamo: incrementa udsEntregadas (físicamente salen) + guarda deuda
    const nc = data.custodias.map(c => c.id === prestamoData.custodiaId ? { ...c, udsEntregadas: c.udsEntregadas + prestamoData.uds } : c);
    const nd = { ...data, custodias: nc, prestamos: [...(data.prestamos || []), prestamoData] };
    setData(nd); persist(nd); setPrestamoTarget(null);
  };

  const handleSaldarDeuda = (prestamoId) => {
    const np = (data.prestamos || []).map(p => p.id === prestamoId ? { ...p, saldado: true } : p);
    const nd = { ...data, prestamos: np };
    setData(nd); persist(nd);
  };

  const handleEditar = (updated) => {
    const nd = { ...data, custodias: data.custodias.map(c => c.id === updated.id ? updated : c) };
    setData(nd); persist(nd); setEditTarget(null);
  };

  const handleDelete = (id) => {
    const nd = { ...data, custodias: data.custodias.filter(c => c.id !== id) };
    setData(nd); persist(nd); setDeleteTarget(null);
  };

  const activasCnt = data ? data.custodias.filter(c => c.udsTotales - c.udsEntregadas > 0).length : 0;
  const deudasCnt = data ? (data.prestamos || []).filter(p => !p.saldado).length : 0;

  if (!data) return (
    <div className="app">
      <div className="loader"><div className="spinner" /><span>Cargando datos...</span></div>
    </div>
  );

  return (
    <div className="app">
      <header className="header">
        <div className="logo">
          <LogoAD size={40} color={darkMode ? "#FFFFFF" : "#002D5A"} />
          <div>
            <div className="logo-text">Recambios Ibiza</div>
            <div className="logo-sub">GESTOR DE STOCK EN CUSTODIA</div>
          </div>
        </div>
        <div className="header-right">
          <div className={`header-save ${saveStatus === "saved" ? "saved" : ""}`}>
            {saveStatus === "saving" ? "⟳ Guardando..." : "✓ Sincronizado"}
          </div>
          <div className="theme-toggle">
            <button className={`theme-opt ${!darkMode ? "active" : ""}`} onClick={() => setDarkMode(false)}>Claro</button>
            <button className={`theme-opt ${darkMode ? "active" : ""}`} onClick={() => setDarkMode(true)}>Oscuro</button>
          </div>
        </div>
      </header>

      <nav className="nav">
        {[
          { id: "dashboard",  label: "Panel de Control" },
          { id: "clientes",   label: "Clientes" },
          { id: "custodias",  label: "Custodias" },
          { id: "historial",  label: "Historial" },
        ].map(t => (
          <button key={t.id} className={`nav-btn ${tab === t.id ? "active" : ""}`} onClick={() => setTab(t.id)}>
            {t.label}
          </button>
        ))}
      </nav>

      <main className="main">
        <div className="main-inner">
        {tab === "dashboard" && (
          <Dashboard
            data={data}
            onNuevaCustodia={() => setModal("nueva")}
            onNuevaEntrega={() => setShowNuevaEntrega(true)}
            onEntrega={c => setSelectedCustodia(c)}
            onDelete={c => setDeleteTarget(c)}
            onEditar={c => setEditTarget(c)}
            onPrestamo={c => setPrestamoTarget(c)}
            onSaldarDeuda={handleSaldarDeuda}
          />
        )}
        {tab === "clientes"  && <div className="tab-scroll"><Clientes data={data} /></div>}
        {tab === "custodias" && <div className="tab-scroll"><TabCustodias data={data} /></div>}
        {tab === "historial" && <div className="tab-scroll"><Historial data={data} /></div>}
        </div>{/* end main-inner */}
      </main>

      {editTarget && (
        <ModalEditarCustodia custodia={editTarget} clientes={clientes} onClose={() => setEditTarget(null)} onSave={handleEditar} />
      )}
      {deleteTarget && (
        <ModalConfirmar
          titulo="¿Eliminar esta custodia?"
          tipo="danger"
          labelConfirm="🗑️ Sí, eliminar"
          mensaje={`Vas a eliminar la custodia de ${deleteTarget.cliente} · ${deleteTarget.referencia} · ${deleteTarget.producto}`}
          detalles={`Albarán: ${deleteTarget.albaran || "—"} · Almacén: ${deleteTarget.almacen} · ${deleteTarget.udsTotales - deleteTarget.udsEntregadas} ud. pendientes`}
          onConfirm={() => handleDelete(deleteTarget.id)}
          onClose={() => setDeleteTarget(null)}
        />
      )}
      {showNuevaEntrega && (
        <ModalNuevaEntrega data={data} onClose={() => setShowNuevaEntrega(false)} onSave={handleNuevaEntrega} />
      )}
      {modal === "nueva" && (
        <ModalNuevaCustodia clientes={clientes} onClose={() => setModal(null)} onSave={handleNuevaCustodia} />
      )}
      {selectedCustodia && (
        <ModalEntrega custodia={selectedCustodia} onClose={() => setSelectedCustodia(null)} onSave={handleEntrega} allCustodias={data.custodias} />
      )}
      {prestamoTarget && (
        <ModalPrestamo custodia={prestamoTarget} onClose={() => setPrestamoTarget(null)} onSave={handlePrestamo} />
      )}
    </div>
  );
}


    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
