// ─── NUMERACIÓN AUTOMÁTICA DE ENTREGAS ───────────────────────────────────────
function formatNumE(n) { return String(n).padStart(6, "0"); }

function getNextNumEntrega(entregas) {
  const nums = entregas
    .map(e => parseInt(e.numEntrega || "0", 10))
    .filter(n => !isNaN(n) && n > 0);
  return nums.length > 0 ? Math.max(...nums) + 1 : 1;
}

const SUPABASE_URL = "https://szoatrosdwrvcowdrtwb.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN6b2F0cm9zZHdydmNvd2RydHdiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwOTc1MDksImV4cCI6MjA5NDY3MzUwOX0.fkP-9NFv55tlUSrh2-_MwPXiMDS4RwVuq6SP9yYojCo";

// ─── SESIÓN / LOGIN ─────────────────────────────────────────────────────────
// Con las tablas protegidas por RLS (auth.role() = 'authenticated'), la clave
// pública anon ya no da acceso a ningún dato por sí sola: hace falta una
// sesión de login válida (access_token) para leer o escribir.
const SESSION_KEY = "ri-session";
let _session = null;
let _onAuthExpired = null; // callback que fuerza volver al login si la sesión ya no vale

function loadSession() {
  try {
    const raw = localStorage.getItem(SESSION_KEY);
    _session = raw ? JSON.parse(raw) : null;
  } catch { _session = null; }
  return _session;
}

function saveSession(session) {
  _session = session;
  if (session) localStorage.setItem(SESSION_KEY, JSON.stringify(session));
  else localStorage.removeItem(SESSION_KEY);
}

async function login(email, password) {
  const res = await fetch(SUPABASE_URL + "/auth/v1/token?grant_type=password", {
    method: "POST",
    headers: { "Content-Type": "application/json", "apikey": SUPABASE_ANON_KEY },
    body: JSON.stringify({ email, password }),
  });
  const body = await res.json();
  if (!res.ok) throw new Error(body.error_description || body.msg || "Email o contraseña incorrectos");
  saveSession({
    access_token: body.access_token,
    refresh_token: body.refresh_token,
    expires_at: Math.floor(Date.now() / 1000) + body.expires_in,
    email: body.user?.email || email,
  });
}

async function refreshSession() {
  if (!_session || !_session.refresh_token) { saveSession(null); return; }
  try {
    const res = await fetch(SUPABASE_URL + "/auth/v1/token?grant_type=refresh_token", {
      method: "POST",
      headers: { "Content-Type": "application/json", "apikey": SUPABASE_ANON_KEY },
      body: JSON.stringify({ refresh_token: _session.refresh_token }),
    });
    if (!res.ok) { saveSession(null); return; }
    const body = await res.json();
    saveSession({
      access_token: body.access_token,
      refresh_token: body.refresh_token,
      expires_at: Math.floor(Date.now() / 1000) + body.expires_in,
      email: body.user?.email || _session.email,
    });
  } catch { saveSession(null); }
}

function logout() {
  saveSession(null);
}

async function updatePassword(newPassword) {
  const headers = await authHeaders();
  const res = await fetch(SUPABASE_URL + "/auth/v1/user", {
    method: "PUT",
    headers,
    body: JSON.stringify({ password: newPassword }),
  });
  const body = await res.json();
  if (!res.ok) throw new Error(body.error_description || body.msg || "No se pudo cambiar la contraseña");
  return body;
}

async function authHeaders() {
  if (_session && _session.expires_at - 30 < Math.floor(Date.now() / 1000)) {
    await refreshSession();
  }
  return {
    "Content-Type": "application/json",
    "apikey": SUPABASE_ANON_KEY,
    "Authorization": "Bearer " + (_session ? _session.access_token : SUPABASE_ANON_KEY),
  };
}

// ─── ACCESO A DATOS: una fila por custodia/entrega/préstamo ────────────────
// Cada operación toca solo su propia fila (insert/update/delete puntual) en
// vez de sobreescribir un bloque JSON entero: dos operarios guardando a la
// vez ya no pueden pisarse el trabajo mutuamente.

async function apiFetch(path, options = {}) {
  const headers = { ...(await authHeaders()), ...(options.headers || {}) };
  const res = await fetch(SUPABASE_URL + path, { ...options, headers });
  if (res.status === 401 || res.status === 403) {
    saveSession(null);
    if (_onAuthExpired) _onAuthExpired();
    throw new Error("Sesión caducada, vuelve a iniciar sesión.");
  }
  if (!res.ok) throw new Error("Error de red (" + res.status + ")");
  return res;
}

async function dbSelect(table) {
  const res = await apiFetch(`/rest/v1/${table}?select=*`);
  return res.json();
}

async function dbInsert(table, rows) {
  const res = await apiFetch(`/rest/v1/${table}`, {
    method: "POST",
    headers: { Prefer: "return=representation" },
    body: JSON.stringify(rows),
  });
  return res.json();
}

async function dbUpdate(table, id, patchRow) {
  const res = await apiFetch(`/rest/v1/${table}?id=eq.${encodeURIComponent(id)}`, {
    method: "PATCH",
    headers: { Prefer: "return=representation" },
    body: JSON.stringify(patchRow),
  });
  return res.json();
}

async function dbUpdateWhere(table, column, value, patchRow) {
  const res = await apiFetch(`/rest/v1/${table}?${column}=eq.${encodeURIComponent(value)}`, {
    method: "PATCH",
    headers: { Prefer: "return=representation" },
    body: JSON.stringify(patchRow),
  });
  return res.json();
}

async function dbDelete(table, id) {
  await apiFetch(`/rest/v1/${table}?id=eq.${encodeURIComponent(id)}`, { method: "DELETE" });
}

// ─── MAPEO camelCase (app) ↔ snake_case (columnas de Supabase) ─────────────
const CUSTODIA_FIELDS = {
  cliente: "cliente", albaran: "albaran", facturaLibre: "factura_libre",
  operarioCustodia: "operario_custodia", fecha: "fecha", referencia: "referencia",
  producto: "producto", almacen: "almacen", udsTotales: "uds_totales",
  udsEntregadas: "uds_entregadas", notas: "notas", promSkrit: "prom_skrit",
};
const ENTREGA_FIELDS = {
  custodiaId: "custodia_id", fecha: "fecha", uds: "uds", albaran: "albaran",
  operario: "operario", notas: "notas", numEntrega: "num_entrega", grupoEntrega: "grupo_entrega",
};
const PRESTAMO_FIELDS = {
  custodiaId: "custodia_id", uds: "uds", clienteDeutor: "cliente_deudor",
  motivo: "motivo", fecha: "fecha", saldado: "saldado",
};

function toRow(obj, fields) {
  const row = {};
  if (obj.id !== undefined) row.id = obj.id;
  for (const [js, db] of Object.entries(fields)) if (obj[js] !== undefined) row[db] = obj[js];
  return row;
}
function fromRow(row, fields) {
  const obj = { id: row.id };
  for (const [js, db] of Object.entries(fields)) obj[js] = row[db];
  return obj;
}

async function loadData() {
  const [custRows, entRows, presRows] = await Promise.all([
    dbSelect("custodias"), dbSelect("entregas"), dbSelect("prestamos"),
  ]);
  return {
    custodias: custRows.map(r => fromRow(r, CUSTODIA_FIELDS)),
    entregas: entRows.map(r => fromRow(r, ENTREGA_FIELDS)),
    prestamos: presRows.map(r => fromRow(r, PRESTAMO_FIELDS)),
  };
}

// Poll simple: cada 10s se refresca desde las tablas. Ya no hace falta
// comparar timestamps ni bloquear por "guardado en curso": cada guardado es
// atómico sobre su propia fila, así que un refresco nunca puede deshacer el
// cambio de otro operario ni el propio.
async function pollRemote(setData) {
  try {
    const fresh = await loadData();
    setData(fresh);
  } catch (_) { /* ignorar errores de red en polling */ }
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2);
}

function fmt(dateStr) {
  if (!dateStr || dateStr === "CONTINUACION" || dateStr === "FERIA") return "—";
  try {
    const d = new Date(dateStr);
    if (isNaN(d.getTime())) return dateStr;
    return d.toLocaleDateString("es-ES", { day: "2-digit", month: "2-digit", year: "numeric" });
  } catch { return dateStr; }
}

function fmtNow() {
  return new Date().toLocaleDateString("es-ES", { day: "2-digit", month: "2-digit", year: "numeric" });
}

// Estima los litros por unidad a partir del texto libre de "Descripción del
// producto" (ej. "MDX+ 5W40 5L" → 5, "REFRIGERANTE 500ML" → 0.5). Es una
// aproximación: si el texto no trae un patrón reconocible, cuenta como 0.
function parseLitrosPorUnidad(producto) {
  if (!producto) return 0;
  const enMl = producto.match(/(\d+(?:[.,]\d+)?)\s*ML\b/i);
  if (enMl) return parseFloat(enMl[1].replace(",", ".")) / 1000;
  const enL = producto.match(/(\d+(?:[.,]\d+)?)\s*L\b/i);
  if (enL) return parseFloat(enL[1].replace(",", "."));
  return 0;
}

        const pendMostrar = isCurrent ? Math.max(0, c.udsTotales - c.udsEntregadas - entrega.uds) : Math.max(0, c.udsTotales - c.udsEntregadas);
        return { c, isCurrent, entregadasMostrar, pendMostrar };
      }).filter(({ pendMostrar }) => pendMostrar > 0).map(({ c, isCurrent, entregadasMostrar, pendMostrar }) => `<tr${isCurrent ? ' style="background:#f0fff4;"' : ''}>
          <td>${c.referencia}</td><td>${c.producto}</td><td>${c.almacen}</td>
          <td style="text-align:right">${c.udsTotales}</td>
          <td style="text-align:right">${entregadasMostrar}</td>
          <td style="text-align:right" class="pendiente">${pendMostrar}</td>
        </tr>`).join('')}
    </tbody>
  </table>
</div>
<div class="firma-grid">
  <div class="firma-box">Firma cliente<br><br><br></div>
  <div class="firma-box">Firma operario<br><br><br></div>
</div>
<div class="footer">Recambios Ibiza S.A. · AD Parts Distribución · Nº Entrega ${numE} · ${date}</div>
</div>
</body></html>`;

  const win = window.open('', '_blank', 'width=820,height=950');
  win.document.write(html);
  win.document.close();
  setTimeout(() => win.print(), 500);
}

// ─── STOCK BAR ───────────────────────────────────────────────────────────────
function StockBar({ entregadas, totales }) {
  const pct = totales > 0 ? Math.min(100, Math.round((entregadas / totales) * 100)) : 0;
  const pendientes = totales - entregadas;
  const color = pendientes <= 0 ? "#4caf7d" : pct >= 70 ? "#E20613" : "#002D5A";
  return (
    <div className="stock-bar-wrap">
      <div className="stock-bar-track">
        <div className="stock-bar-fill" style={{ width: `${pct}%`, background: color }} />
      </div>
      <div className="stock-pct">{pendientes} restantes</div>
    </div>
  );
}

function StatusTag({ entregadas, totales }) {
  const pendientes = totales - entregadas;
  if (pendientes <= 0) return <span className="tag tag-green">COMPLETO</span>;
  if (pendientes <= totales * 0.15) return <span className="tag tag-accent">CASI AGOTADO</span>;
  return <span className="tag tag-blue">EN CUSTODIA</span>;
}

  const [step, setStep] = useState(1);

  const [cantidades, setCantidades] = useState({});

  // Clientes con stock activo
  const clientesActivos = [...new Set(
    data.custodias
      .filter(c => c.udsTotales - c.udsEntregadas > 0)
      .map(c => c.cliente)
  )].sort();

  // Custodias activas del cliente seleccionado
  const custodiasCliente = data.custodias.filter(
    c => c.cliente === clienteSeleccionado && c.udsTotales - c.udsEntregadas > 0
  );

  const setCantidad = (id, val) => setCantidades(prev => ({ ...prev, [id]: val }));

                style={{ fontSize: 14, padding: "12px 14px" }}>
                <option value="">— Selecciona un cliente —</option>
                {clientesActivos.map(c => <option key={c} value={c}>{c}</option>)}
              </select>
            </div>
            {clienteSeleccionado && (
              <div className="alert alert-info">
                {custodiasCliente.length} línea{custodiasCliente.length !== 1 ? "s" : ""} de producto activa{custodiasCliente.length !== 1 ? "s" : ""} para <strong>{clienteSeleccionado}</strong>
              </div>
            )}

              <button className="btn btn-ghost" onClick={onClose}>Cancelar</button>
              <button className="btn btn-green" onClick={() => setStep(2)} disabled={!clienteSeleccionado}
                style={{ opacity: clienteSeleccionado ? 1 : 0.4 }}>
                Seleccionar productos →
              </button>
            </div>
          </div>
        )}

        {/* STEP 2: QUANTITIES */}
        {step === 2 && (
          <div>
            <div style={{ marginBottom: 14, fontFamily: "var(--mono,monospace)", fontSize: 12, color: "var(--text-dim)" }}>
              Cliente: <strong style={{ color: "var(--text)" }}>{clienteSeleccionado}</strong> · Indica las unidades a entregar de cada producto (deja en 0 los que no se entregan)
            </div>
            <div style={{ border: "1px solid var(--border)", borderRadius: 8, overflow: "hidden", marginBottom: 16 }}>
              <table style={{ width: "100%", borderCollapse: "collapse", fontFamily: "var(--mono,monospace)", fontSize: 12 }}>
                <thead>
                  <tr>
                    <th style={{ background: "var(--surface2)", padding: "8px 12px", textAlign: "left", fontSize: 10, textTransform: "uppercase", letterSpacing: "0.8px", color: "var(--text-dim)", borderBottom: "1px solid var(--border)" }}>Referencia</th>
                    <th style={{ background: "var(--surface2)", padding: "8px 12px", textAlign: "left", fontSize: 10, textTransform: "uppercase", letterSpacing: "0.8px", color: "var(--text-dim)", borderBottom: "1px solid var(--border)" }}>Producto</th>
                    <th style={{ background: "var(--surface2)", padding: "8px 12px", textAlign: "center", fontSize: 10, textTransform: "uppercase", letterSpacing: "0.8px", color: "var(--text-dim)", borderBottom: "1px solid var(--border)" }}>Disponibles</th>
                    <th style={{ background: "var(--surface2)", padding: "8px 12px", textAlign: "center", fontSize: 10, textTransform: "uppercase", letterSpacing: "0.8px", color: "var(--text-dim)", borderBottom: "1px solid var(--border)" }}>A entregar</th>
                  </tr>
                </thead>
                <tbody>
                  {custodiasCliente.map((c, i) => {
                    const disponibles = c.udsTotales - c.udsEntregadas;
                    const val = cantidades[c.id] || "";
                    const numVal = Number(val);
                    const isOver = numVal > disponibles;
                    const isActive = numVal > 0 && !isOver;
                    const dispRestante = disponibles - (numVal > 0 ? numVal : 0);
                    return (
                      <tr key={c.id} style={{ background: isActive ? "rgba(26,127,75,0.06)" : i % 2 === 1 ? "var(--surface2)" : "transparent" }}>

            </div>

              <div className="form-group">
                <label>Fecha de entrega</label>

  );
}

// ─── NÚMERO ANIMADO (cuenta rápido hasta el valor final al montar) ─────────
// Solo anima la primera vez que aparece en pantalla (ej. al entrar en la
// pestaña); si el valor cambia después por una actualización en segundo
// plano, se actualiza directo sin volver a animar.
function AnimatedNumber({ value, duration = 700 }) {
  const [display, setDisplay] = useState(0);
  const animado = useRef(false);

  useEffect(() => {
    if (!animado.current) {
      animado.current = true;
      let raf;
      let start = null;
      const to = value;
      const step = (ts) => {
        if (start === null) start = ts;
        const progress = Math.min((ts - start) / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3);
        setDisplay(Math.round(to * eased));
        if (progress < 1) raf = requestAnimationFrame(step);
      };
      raf = requestAnimationFrame(step);
      return () => cancelAnimationFrame(raf);
    }
    setDisplay(value);
  }, [value]);

  return display.toLocaleString("es-ES");
}

function Dashboard({ data, isMobile, onNuevaCustodia, onNuevaEntrega, onEntrega, onDelete, onEditar, onEditarEntrega, onDeleteEntrega, onPrestamo, onSaldarDeuda }) {
  const [search, setSearch] = useState("");
  const [filterCliente, setFilterCliente] = useState("");
  const [filterAlmacen, setFilterAlmacen] = useState("");
  const [filterEstado, setFilterEstado] = useState("");
  const [filterAlbaran, setFilterAlbaran] = useState("");
  const [filterYear, setFilterYear] = useState("");

  const clientes = [...new Set(data.custodias.map(c => c.cliente))].sort();
  const almacenes = [...new Set(data.custodias.map(c => c.almacen).filter(a => a && a !== "CONTINUACION"))].sort();
  const years = [...new Set(
    data.custodias.map(c => c.fecha?.match(/^(\d{4})/)?.[1]).filter(Boolean)
  )].sort().reverse();

  // Map prestamos to custodias
  const custodiaDeudas = {};
  (data.prestamos || []).filter(p => !p.saldado).forEach(p => {
    if (!custodiaDeudas[p.custodiaId]) custodiaDeudas[p.custodiaId] = [];
    custodiaDeudas[p.custodiaId].push(p);
  });

  const ningunoSeleccionado = !filterCliente && !search && !filterAlbaran && !filterYear;

  const filtered = ningunoSeleccionado ? [] : data.custodias.filter(c => {
    const pendientes = c.udsTotales - c.udsEntregadas;
    if (filterEstado === "ACTIVAS" && pendientes <= 0) return false;
    if (filterEstado === "COMPLETAS" && pendientes > 0) return false;
    if (filterCliente && c.cliente !== filterCliente) return false;
    if (filterAlmacen && c.almacen !== filterAlmacen) return false;
    if (filterAlbaran && !(c.albaran || "").toLowerCase().includes(filterAlbaran.toLowerCase())) return false;
    if (filterYear && !(c.fecha || "").startsWith(filterYear)) return false;
    const q = search.toLowerCase();
    if (q && !`${c.cliente} ${c.referencia} ${c.producto} ${c.albaran}`.toLowerCase().includes(q)) return false;
    return true;
  }).sort((a, b) => (b.fecha || "").localeCompare(a.fecha || ""));

  // Entregas enriquecidas del cliente seleccionado (para vista "Completadas")
  const entregasCliente = filterCliente ? data.entregas
    .filter(e => { const c = data.custodias.find(x => x.id === e.custodiaId); return c?.cliente === filterCliente; })
    .map(e => { const c = data.custodias.find(x => x.id === e.custodiaId) || {}; return { ...e, custodia: c }; })
    .sort((a, b) => (b.fecha || "").localeCompare(a.fecha || ""))
    : [];

  const totalUds = data.custodias.reduce((s, c) => s + c.udsTotales, 0);
  const entregadasUds = data.custodias.reduce((s, c) => s + c.udsEntregadas, 0);
  const activasCnt = data.custodias.filter(c => c.udsTotales - c.udsEntregadas > 0).length;
  const clientesCnt = new Set(data.custodias.map(c => c.cliente)).size;
  const litrosCustodia = data.custodias.reduce((s, c) => {
    const pendientes = c.udsTotales - c.udsEntregadas;
    return pendientes > 0 ? s + pendientes * parseLitrosPorUnidad(c.producto) : s;
  }, 0);
  const deudasActivas = (data.prestamos || []).filter(p => !p.saldado);

  return (
    <div style={{ display: "flex", flexDirection: "column", flex: 1, overflow: "hidden" }}>
      <div className="dash-top">
      {deudasActivas.length > 0 && (
        <div style={{ marginBottom: 16 }}>
          {isMobile ? (
            <div className="debt-alert">
              <span>⚠️</span>
              <span style={{ flex: 1 }}>
                <strong>{deudasActivas.length} {deudasActivas.length === 1 ? "deuda activa" : "deudas activas"}</strong>
              </span>
            </div>
          ) : deudasActivas.map(p => {
            const cust = data.custodias.find(c => c.id === p.custodiaId);
            return (
              <div key={p.id} className="debt-alert">
                <span>⚠️</span>
                <span style={{ flex: 1 }}>
                  <strong>DEUDA ACTIVA:</strong> {p.uds} ud. de {cust?.referencia || "ref. desconocida"} tomadas de la custodia de <strong>{cust?.cliente}</strong> para {p.clienteDeutor} el {fmt(p.fecha)}
                  {p.motivo && ` · ${p.motivo}`}
                </span>
                <button className="btn btn-sm btn-ghost" onClick={() => onSaldarDeuda(p.id)}>✓ Saldar</button>

// ─── COLOR POR TIPO DE MOVIMIENTO ────────────────────────────────────────────
function colorTipo(tipo) {
  if (tipo === "CUSTODIA") return { bg: "rgba(46,125,50,0.15)", fg: "var(--green)" };
  if (tipo === "PRESTAMO") return { bg: "rgba(255,140,0,0.15)", fg: "#ff8c00" };

}

function reprintMovimiento(m, data, autoprint = true) {
  if (m.tipo === "ENTREGA") {
    // Si es un grupo de entrega múltiple

      const entregasGrupo = data.entregas.filter(e => e.grupoEntrega === m.grupoEntregaKey);
      const lineas = entregasGrupo.map(e => ({ custodiaId: e.custodiaId, uds: e.uds }));
      const operario = entregasGrupo[0]?.operario || "";
      const albaran = entregasGrupo[0]?.albaran || "";
      // Reconstruir estado pre-guardado para impresión correcta
      const custodiasPrevias = data.custodias.map(c => {
        const udsDev = entregasGrupo.filter(e => e.custodiaId === c.id).reduce((s,e)=>s+e.uds,0);
        return udsDev > 0 ? { ...c, udsEntregadas: Math.max(0, c.udsEntregadas - udsDev) } : c;

      printMultiDeliveryDoc(m.cliente, lineas, custodiasPrevias, operario, albaran);

// ─── HISTORIAL DE MOVIMIENTOS ────────────────────────────────────────────────
function Historial({ data }) {
  const [search, setSearch] = useState("");
  const [filterTipo, setFilterTipo] = useState("TODOS");

  // Combinar custodias (ENTRADA), entregas agrupadas (SALIDA) y préstamos
  // temporales en un solo timeline
  const gruposEntrega = agruparEntregas(data.entregas, data.custodias);
  const movimientos = [
    ...data.custodias.map(c => ({
      id: "c-" + c.id, tipo: "CUSTODIA",
      fecha: c.fecha || "", cliente: c.cliente,
      referencia: c.referencia, producto: c.producto,
      almacen: c.almacen, uds: c.udsTotales,
      operario: c.operarioCustodia || "", albaran: c.albaran, notas: c.notas,
      esMultiple: false, grupoEntregaKey: null,
    })),
    ...gruposEntrega.map(g => ({
      id: "eg-" + g.key,
      tipo: "ENTREGA",
      fecha: g.fecha,
      cliente: g.cliente,
      referencia: g.esMultiple ? "MÚLTIPLE" : (g.lineas[0]?.referencia || ""),
      producto: g.esMultiple
        ? g.lineas.map(l => l.referencia + " ×" + l.uds).join("  ·  ")
        : (g.lineas[0]?.producto || ""),
      almacen: g.esMultiple ? "" : (g.lineas[0]?.almacen || ""),
      uds: g.totalUds,
      operario: g.operario,
      albaran: g.primerNumEntrega ? "#" + g.primerNumEntrega + (g.esMultiple ? "…" : "") + (g.albaran ? " · " + g.albaran : "") : (g.albaran || ""),
      notas: "",
      esMultiple: g.esMultiple,
      grupoEntregaKey: g.esMultiple ? g.key : null,
      lineas: g.lineas,
      primerNumEntrega: g.primerNumEntrega || "",
    })),
    ...(data.prestamos || []).map(p => {
      const custodia = data.custodias.find(c => c.id === p.custodiaId);
      return {
        id: "p-" + p.id,
        tipo: "PRESTAMO",
        fecha: p.fecha || "",
        cliente: custodia?.cliente || "Cliente eliminado",
        referencia: custodia?.referencia || "",
        producto: (custodia?.producto || "") + (p.clienteDeutor ? `  ·  Para: ${p.clienteDeutor}` : ""),
        almacen: custodia?.almacen || "",
        uds: p.uds,
        operario: "",
        albaran: p.saldado ? "SALDADO" : "ACTIVO",
        notas: p.motivo || "",
        esMultiple: false, grupoEntregaKey: null,
        saldado: p.saldado,
      };
    })
  ]
  .filter(m => filterTipo === "TODOS" || m.tipo === filterTipo)
  .filter(m => {
    if (!search) return true;
    const q = search.toLowerCase();
    return `${m.cliente} ${m.referencia} ${m.producto} ${m.albaran} ${m.operario} ${m.notas}`.toLowerCase().includes(q);
  })
  .sort((a, b) => {
    const da = a.fecha && a.fecha.match(/^\d{4}/) ? a.fecha : "1900";
    const db = b.fecha && b.fecha.match(/^\d{4}/) ? b.fecha : "1900";
    const fc = db.localeCompare(da);
    if (fc !== 0) return fc;
    // Mismo día: ENTREGA por numEntrega desc, resto por id desc
    const na = parseInt((a.primerNumEntrega||"").replace(/\D/g,"") || "0");
    const nb = parseInt((b.primerNumEntrega||"").replace(/\D/g,"") || "0");
    if (na > 0 || nb > 0) return nb - na;
    return (b.id||"").localeCompare(a.id||"");
  });

  const FILTROS = [
    ["TODOS", "Todos"],
    ["CUSTODIA", "Custodias"],
    ["ENTREGA", "Entregas"],
    ["PRESTAMO", "Préstamos"],
  ];

  return (
    <div style={{ display:"flex", flexDirection:"column", height:"100%" }}>
      {/* Cabecera fija */}
      <div style={{ padding:"20px 28px 0", flexShrink:0, background:"var(--bg)" }}>
        <div className="section-header">
          <div>
            <div className="section-title">Histórico de movimientos</div>
            <div className="section-sub">{movimientos.length} movimientos · {data.custodias.length} custodias · {data.entregas.length} entregas · {(data.prestamos||[]).length} préstamos</div>
          </div>
        </div>
        <div style={{ display:"flex", gap:6, marginBottom:12, flexWrap:"wrap" }}>
          {FILTROS.map(([key, label]) => (
            <button key={key}
              className={"btn btn-sm " + (filterTipo === key ? "btn-primary" : "btn-ghost")}
              onClick={() => setFilterTipo(key)}>
              {label}
            </button>
          ))}
        </div>
        <div className="search-bar" style={{ paddingBottom:12, marginBottom:0 }}>
          <input className="search-input" placeholder="🔍  Buscar por cliente, referencia, operario, albarán..." value={search} onChange={e => setSearch(e.target.value.toUpperCase())} />
        </div>
      </div>

// ─── CLIENTES ─────────────────────────────────────────────────────────────────
function Clientes({ data }) {
  const [search, setSearch] = useState("");

  const map = {};
  data.custodias.forEach(c => {
    if (!map[c.cliente]) map[c.cliente] = { custodias: 0, pendientes: 0, almacenes: new Set() };
    map[c.cliente].custodias++;
    map[c.cliente].pendientes += c.udsTotales - c.udsEntregadas;
    if (c.almacen && c.almacen !== "CONTINUACION") map[c.cliente].almacenes.add(c.almacen);
  });

  const sorted = Object.entries(map)
    .filter(([cliente]) => !search || cliente.toLowerCase().includes(search.toLowerCase()))
    .sort((a, b) => b[1].custodias - a[1].custodias);

  return (
    <div>
      <div className="section-header">
        <div>
          <div className="section-title">Resumen por cliente</div>
          <div className="section-sub">{sorted.length} clientes con custodias</div>
        </div>
      </div>
      <div className="search-bar">
        <input className="search-input" placeholder="🔍  Buscar cliente..." value={search} onChange={e => setSearch(e.target.value.toUpperCase())} />
      </div>
      {sorted.length === 0 ? (
        <div className="empty"><div className="empty-icon">👥</div><div className="empty-title">Sin clientes</div></div>
      ) : (
        <div className="table-wrap">
          <table>
            <thead><tr><th>Cliente</th><th>Nº Custodias</th><th>Uds. pendientes</th><th>Almacenes</th><th>Estado</th></tr></thead>
            <tbody>
              {sorted.map(([cliente, info]) => (
                <tr key={cliente}>
                  <td style={{ fontWeight: 700 }}>{cliente}</td>
                  <td>{info.custodias}</td>
                  <td style={{ fontFamily: "var(--mono, monospace)", fontWeight: 700, color: "var(--green)" }}>{info.pendientes}</td>
                  <td>{[...info.almacenes].map(a => <span key={a} className="tag tag-accent" style={{ marginRight: 4 }}>{a}</span>)}</td>
                  <td>{info.pendientes > 0 ? <span className="tag tag-green">ACTIVO</span> : <span style={{color:"var(--text-dim)",fontSize:11}}>COMPLETO</span>}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

                      const entregasGrupo = data.entregas.filter(e => e.grupoEntrega === g.key);
                      const lineas = entregasGrupo.map(e => ({ custodiaId: e.custodiaId, uds: e.uds }));
                      const custPrev = data.custodias.map(c => { const ud=entregasGrupo.filter(e=>e.custodiaId===c.id).reduce((s,e)=>s+e.uds,0); return ud>0?{...c,udsEntregadas:Math.max(0,c.udsEntregadas-ud)}:c; });
                      printMultiDeliveryDoc(g.cliente, lineas, custPrev, g.operario, g.albaran);
                    } else {
                      const entrega = data.entregas.find(e => e.id === g.lineas[0]?.id);
                      const custodia = data.custodias.find(c => c.id === entrega?.custodiaId);
                      if (entrega && custodia) { const cp={...custodia,udsEntregadas:Math.max(0,custodia.udsEntregadas-entrega.uds)}; const ap=data.custodias.map(c=>c.id===custodia.id?cp:c); printDeliveryDoc(cp, entrega, ap); }
                    }
                  }}>🖨️</button>
              </td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );

function PanelConfig({ fontSize, onFontSize, onClose, data, onChangePassword }) {
  const sizes = [
    { key: 'sm',  label: 'A',  title: 'Pequeño',    scale: '90%'  },
    { key: 'md',  label: 'A',  title: 'Normal',     scale: '100%' },
    { key: 'lg',  label: 'A',  title: 'Grande',     scale: '112%' },
    { key: 'xl',  label: 'A',  title: 'Extra',      scale: '125%' },
  ];

  const handleExport = () => {
    const fecha = new Date().toISOString().split("T")[0];
    const payload = {
      exportadoEl: new Date().toISOString(),
      custodias: data.custodias,
      entregas: data.entregas,
      prestamos: data.prestamos,
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `backup-custodias-${fecha}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  return (
    <>
      <div className="config-overlay" onClick={onClose} />
      <div className="config-panel">
        <div className="config-title">⚙️ Configuración</div>
        <div className="config-label">Tamaño de letra</div>
        <div className="font-size-btns">
          {sizes.map((s, i) => (
            <button key={s.key}
              className={"font-size-btn" + (fontSize === s.key ? " active" : "")}
              style={{ fontSize: 10 + i * 2 + 'px' }}
              title={s.title}
              onClick={() => { onFontSize(s.key, s.scale); onClose(); }}>
              {s.label}
            </button>
          ))}
        </div>
        <div className="config-label" style={{ marginTop: 20 }}>Copia de seguridad</div>
        <button className="btn btn-ghost" style={{ width: "100%" }} onClick={handleExport}>⬇️ Exportar datos (JSON)</button>
        <div className="config-label" style={{ marginTop: 20 }}>Cuenta</div>
        <button className="btn btn-ghost" style={{ width: "100%" }} onClick={() => { onClose(); onChangePassword(); }}>🔑 Cambiar contraseña</button>
      </div>
    </>
  );
}

// ─── AGRUPAR ENTREGAS (múltiples vs simples) ─────────────────────────────────
function agruparEntregas(entregas, custodias) {
  const grupos = {};
  // Ordenar por fecha desc primero
  const sorted = [...entregas].sort((a,b) => (b.fecha||"").localeCompare(a.fecha||""));
  sorted.forEach(e => {
    const key = e.grupoEntrega || e.id; // sin grupo = cada entrega es su propio grupo
    const c = custodias.find(x => x.id === e.custodiaId) || {};
    if (!grupos[key]) {
      grupos[key] = {
        key,
        esMultiple: false, // se actualiza abajo si hay >1 línea
        fecha: e.fecha || "",
        operario: e.operario || "",
        albaran: e.albaran || "",
        cliente: c.cliente || "Cliente eliminado",
        lineas: [],
        totalUds: 0,
        primerNumEntrega: e.numEntrega || "",
        // guardar ids para reimpresión
        entregaIds: [],
      };
    }
    grupos[key].lineas.push({
      custodiaId: e.custodiaId,
      referencia: c.referencia || "",
      producto: c.producto || "",
      almacen: c.almacen || "",
      uds: e.uds,
      numEntrega: e.numEntrega || "",
      id: e.id,
    });
    grupos[key].totalUds += e.uds;
    grupos[key].entregaIds.push(e.id);
    if (grupos[key].lineas.length > 1) grupos[key].esMultiple = true;
  });
  return Object.values(grupos).sort((a,b) => (b.fecha||"").localeCompare(a.fecha||""));
}

// ─── PRINT PRODUCTOS ─────────────────────────────────────────────────────────
function printProductosDoc(productos) {
  const date = fmtNow();
  let rows = '';
  productos.forEach(p => {
    Object.entries(p.almacenes).forEach(([alm, uds], i) => {
      rows += '<tr>'
        + (i === 0 ? '<td rowspan="' + Object.keys(p.almacenes).length + '" style="font-weight:bold;vertical-align:top">' + p.referencia + '</td>'
                   + '<td rowspan="' + Object.keys(p.almacenes).length + '" style="vertical-align:top">' + p.producto + '</td>' : '')
        + '<td>' + alm + '</td>'
        + '<td style="text-align:right;font-weight:bold;color:#1a7f4b">' + uds + '</td>'
        + (i === 0 ? '<td rowspan="' + Object.keys(p.almacenes).length + '" style="text-align:right;font-weight:bold;color:#E20613;vertical-align:top">' + p.totalPend + '</td>' : '')
        + (p.tieneDeuda && i === 0 ? '<td rowspan="' + Object.keys(p.almacenes).length + '" style="color:#ff8c00;vertical-align:top">⚠️ Préstamo activo</td>' : (i === 0 ? '<td rowspan="' + Object.keys(p.almacenes).length + '"></td>' : ''))
        + '</tr>';
    });
  });

// ─── TAB PRODUCTOS ────────────────────────────────────────────────────────────
function TabProductos({ data, onBulkUpdateRef }) {
  const [search, setSearch] = useState('');
  const [editando, setEditando] = useState(null); // {refOld, referencia, producto}
  const [confirmEdit, setConfirmEdit] = useState(false);

  // Prestamos activos por custodia
  const prestamosActivos = new Set(
    (data.prestamos || []).filter(p => !p.saldado).map(p => p.custodiaId)
  );

  // Agrupar custodias activas por referencia
  const refMap = {};
  data.custodias.filter(c => c.udsTotales - c.udsEntregadas > 0).forEach(c => {
    const key = c.referencia;
    if (!refMap[key]) refMap[key] = { referencia: c.referencia, producto: c.producto, almacenes: {}, totalPend: 0, tieneDeuda: false, custodias: [] };
    const pend = c.udsTotales - c.udsEntregadas;
    refMap[key].almacenes[c.almacen] = (refMap[key].almacenes[c.almacen] || 0) + pend;
    refMap[key].totalPend += pend;
    if (prestamosActivos.has(c.id)) refMap[key].tieneDeuda = true;
    refMap[key].custodias.push(c);
  });

  const productos = Object.values(refMap)
    .filter(p => {
      if (!search) return true;
      const q = search.toLowerCase();
      return p.referencia.toLowerCase().includes(q) || p.producto.toLowerCase().includes(q);
    })
    .sort((a, b) => a.referencia.localeCompare(b.referencia));

  const totalGeneral = productos.reduce((s,p)=>s+p.totalPend, 0);

  return (
    <div style={{ display:"flex", flexDirection:"column", height:"100%" }}>
      {/* Cabecera fija */}
      <div style={{ padding:"20px 28px 0", flexShrink:0, background:"var(--bg)" }}>
        <div className="section-header">
          <div>
            <div className="section-title">Stock por producto</div>
            <div className="section-sub">{productos.length} referencias en stock · {totalGeneral} unidades totales</div>
          </div>
          <button className="btn btn-ghost" onClick={() => printProductosDoc(productos)}>🖨️ Imprimir listado</button>
        </div>
        <div className="search-bar" style={{ paddingBottom:12, marginBottom:0 }}>
          <input className="search-input" placeholder="🔍  Buscar por referencia o descripción..." value={search}
            onChange={e => setSearch(e.target.value)} style={{ textTransform: 'none' }} />
        </div>
      </div>
      {/* Contenido scrollable */}
      <div style={{ flex:1, overflowY:"auto", padding:"0 28px 28px" }}>
      {productos.length === 0 ? (
        <div className="empty">
          <div className="empty-icon">📦</div>
          <div className="empty-title">Sin productos en stock</div>
          <div className="empty-sub">No hay custodias activas que coincidan</div>
        </div>
      ) : (
        <div className="table-wrap">
          <table>
            <thead><tr>
              <th>Referencia</th><th>Descripción</th><th>Almacén</th>
              <th style={{textAlign:"right",width:70}}>Uds.</th>
              <th style={{textAlign:"right",width:70}}>Total</th>
              <th style={{width:100}}>Alertas</th>
              <th style={{width:80}}>Editar</th>
            </tr></thead>
            <tbody>
              {productos.map(p => (
                Object.entries(p.almacenes).map(([alm, uds], i) => (
                  <tr key={p.referencia + alm}>
                    {i === 0 && <td rowSpan={Object.keys(p.almacenes).length} style={{ fontFamily:"var(--mono,monospace)", fontWeight:700, color:"var(--text)", verticalAlign:"middle" }}>{p.referencia}</td>}
                    {i === 0 && <td rowSpan={Object.keys(p.almacenes).length} style={{ verticalAlign:"middle" }}>{p.producto}</td>}
                    <td><span className="tag tag-accent">{alm}</span></td>
                    <td style={{ textAlign:"right", fontWeight:700, color:"var(--green)" }}>{Object.keys(p.almacenes).length > 1 ? uds : ""}</td>
                    {i === 0 && <td rowSpan={Object.keys(p.almacenes).length} style={{ textAlign:"right", fontWeight:700, color:"var(--green)", verticalAlign:"middle", fontSize:15 }}>{p.totalPend}</td>}
                    {i === 0 && <td rowSpan={Object.keys(p.almacenes).length} style={{ verticalAlign:"middle" }}>
                      {p.tieneDeuda && <span className="tag tag-orange">⚠️ Préstamo activo</span>}
                    </td>}
                    {i === 0 && <td rowSpan={Object.keys(p.almacenes).length} style={{ verticalAlign:"middle" }}>
                      <button className="btn btn-sm" style={{ background:"rgba(0,45,90,0.1)", color:"var(--blue2)", border:"1px solid rgba(0,45,90,0.2)" }}
                        onClick={() => setEditando({ refOld: p.referencia, referencia: p.referencia, producto: p.producto })}>
                        ✏️ Editar
                      </button>
                    </td>}
                  </tr>
                ))
              ))}
              <tr style={{ borderTop:"2px solid var(--border)", background:"var(--surface2)" }}>
                <td colSpan="4" style={{ fontFamily:"var(--mono,monospace)", fontWeight:700, textAlign:"right", fontSize:11 }}>TOTAL GENERAL</td>
                <td style={{ textAlign:"right", fontWeight:700, color:"var(--green)", fontFamily:"var(--mono,monospace)", fontSize:15 }}>{totalGeneral}</td>
                <td colSpan="2"></td>
              </tr>
            </tbody>
          </table>
        </div>
      )}

      {/* Modal editar referencia/descripción */}
      {editando && !confirmEdit && (
        <div className="modal-overlay" onClick={e => e.target === e.currentTarget && setEditando(null)}>
          <div className="modal" style={{ maxWidth: 480 }}>
            <div className="modal-title">✏️ Editar producto</div>
            <div className="modal-sub">Los cambios se aplicarán a todas las custodias con esta referencia</div>
            <div className="alert" style={{ background:"rgba(255,140,0,0.08)", border:"1px solid rgba(255,140,0,0.25)", color:"#ff8c00", marginBottom:20 }}>
              ⚠️ Se actualizarán todas las custodias con la referencia <strong>{editando.refOld}</strong>
            </div>
            <div className="form-grid cols-1">
              <div className="form-group">
                <label>Referencia</label>
                <input value={editando.referencia} onChange={e => setEditando(prev => ({...prev, referencia: e.target.value.toUpperCase()}))} />
              </div>
              <div className="form-group">
                <label>Descripción del producto</label>
                <input value={editando.producto} onChange={e => setEditando(prev => ({...prev, producto: e.target.value.toUpperCase()}))} />
              </div>
            </div>
            <div className="form-actions">
              <button className="btn btn-ghost" onClick={() => setEditando(null)}>Cancelar</button>
              <button className="btn" style={{ background:"#ff8c00", color:"#fff" }} onClick={() => setConfirmEdit(true)}>Guardar cambios</button>
            </div>
          </div>
        </div>
      )}
      {editando && confirmEdit && (
        <ModalConfirmar
          titulo="¿Confirmar cambio masivo?"
          tipo="warn"
          labelConfirm="✓ Aplicar a todas"
          mensaje={"Referencia: " + editando.refOld + " → " + editando.referencia}
          detalles={"Descripción: " + editando.producto}
          onConfirm={() => { onBulkUpdateRef(editando.refOld, editando.referencia, editando.producto); setEditando(null); setConfirmEdit(false); }}
          onClose={() => setConfirmEdit(false)}
        />
      )}
      </div>{/* end scroll */}
    </div>
  );
}

function LoginScreen({ onLogin }) {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);

  const handleSubmit = async (e) => {
    e.preventDefault();
    if (!email.trim() || !password) return;
    setError(""); setLoading(true);
    try {
      await login(email.trim(), password);
      onLogin();
    } catch (err) {
      setError(err.message || "No se pudo iniciar sesión");
    } finally {
      setLoading(false);
    }
  };

  return (
    <div className="login-screen">
      <form className="login-card" onSubmit={handleSubmit}>
        <LogoAD size={48} darkMode={true} />
        <div className="login-title">Recambios Ibiza</div>
        <div className="login-sub">Gestor de Stock en Custodia</div>
        <div className="form-group" style={{ marginTop: 24 }}>
          <label>Email</label>
          <input type="email" required autoFocus value={email} onChange={e => setEmail(e.target.value)} />
        </div>
        <div className="form-group">
          <label>Contraseña</label>
          <input type="password" required value={password} onChange={e => setPassword(e.target.value)} />
        </div>
        {error && <div className="login-error">⚠️ {error}</div>}
        <button className="btn btn-primary" type="submit" disabled={loading} style={{ width: "100%", marginTop: 8 }}>
          {loading ? "Entrando..." : "Entrar"}
        </button>
      </form>
    </div>
  );
}

// ─── CAMBIAR CONTRASEÑA ─────────────────────────────────────────────────────
function ModalCambiarPassword({ onClose }) {
  const [pass1, setPass1] = useState("");
  const [pass2, setPass2] = useState("");
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);
  const [done, setDone] = useState(false);

  const handleSave = async () => {
    setError("");
    if (pass1.length < 6) { setError("La contraseña debe tener al menos 6 caracteres"); return; }
    if (pass1 !== pass2) { setError("Las contraseñas no coinciden"); return; }
    setLoading(true);
    try {
      await updatePassword(pass1);
      setDone(true);
    } catch (e) {
      setError(e.message || "No se pudo cambiar la contraseña");
    } finally {
      setLoading(false);
    }
  };

  if (done) return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal" style={{ maxWidth: 420 }}>
        <div className="modal-title">✓ Contraseña actualizada</div>
        <div className="modal-sub">La próxima vez que inicies sesión, usa la nueva contraseña.</div>
        <div className="form-actions">
          <button className="btn btn-primary" onClick={onClose}>Cerrar</button>
        </div>
      </div>
    </div>
  );

  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal" style={{ maxWidth: 420 }}>
        <div className="modal-title">🔑 Cambiar contraseña</div>
        <div className="modal-sub">Introduce tu nueva contraseña</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
          <div className="form-group">
            <label>Nueva contraseña</label>
            <input type="password" value={pass1} onChange={e => setPass1(e.target.value)} autoFocus />
          </div>
          <div className="form-group">
            <label>Confirmar contraseña</label>
            <input type="password" value={pass2} onChange={e => setPass2(e.target.value)} />
          </div>
        </div>
        {error && <div className="login-error" style={{ marginTop: 14 }}>⚠️ {error}</div>}
        <div className="form-actions">
          <button className="btn btn-ghost" onClick={onClose}>Cancelar</button>
          <button className="btn btn-primary" onClick={handleSave} disabled={loading}>{loading ? "Guardando..." : "✓ Cambiar contraseña"}</button>
        </div>
      </div>
    </div>
  );
}

// ─── APP ──────────────────────────────────────────────────────────────────────
function MainApp({ onLogout, userEmail }) {
  const [data, setData] = useState(null);
  const [tab, setTab] = useState("dashboard");
  const [modal, setModal] = useState(null);
  const [selectedCustodia, setSelectedCustodia] = useState(null);
  const [prestamoTarget, setPrestamoTarget] = useState(null);
  const [showNuevaEntrega, setShowNuevaEntrega] = useState(false);
  const [editTarget, setEditTarget] = useState(null);
  const [editEntregaTarget, setEditEntregaTarget] = useState(null);
  const [deleteTarget, setDeleteTarget] = useState(null);
  const [deleteEntregaTarget, setDeleteEntregaTarget] = useState(null);
  const [saveStatus, setSaveStatus] = useState("saved");
  const [showAyuda, setShowAyuda] = useState(false);
  const [showConfig, setShowConfig] = useState(false);
  const [showChangePassword, setShowChangePassword] = useState(false);
  const isMobile = typeof window !== 'undefined' && window.innerWidth < 768;
  const [fontSize, setFontSize] = useState(() => localStorage.getItem('ri-fontsize') || 'md');
  const [darkMode, setDarkMode] = useState(() => localStorage.getItem('ri-theme') !== 'light');
  const savingRef = useRef(false);
  useEffect(() => {
    const scales = { sm:'90%', md:'100%', lg:'112%', xl:'125%' };
    document.documentElement.style.fontSize = scales[fontSize] || '100%';
  }, [fontSize]);

  useEffect(() => {
    document.documentElement.setAttribute('data-theme', darkMode ? 'dark' : 'light');
    localStorage.setItem('ri-theme', darkMode ? 'dark' : 'light');
  }, [darkMode]);

  useEffect(() => {
    _onAuthExpired = onLogout;
    loadData().then(d => setData(d)).catch(() => {});
    // Polling cada 10 segundos: cada guardado ya es atómico por fila, así que
    // un refresco nunca puede deshacer el cambio de otro operario ni el propio.
    const interval = setInterval(() => {
      if (!savingRef.current) pollRemote(setData);
    }, 10000);
    return () => { clearInterval(interval); _onAuthExpired = null; };
  }, []);

  const persistGuard = useCallback(async (fn, errorMsg) => {
    savingRef.current = true;
    setSaveStatus("saving");
    try {
      await fn();
    } catch (e) {
      console.error(e);
      alert(errorMsg);
    } finally {
      savingRef.current = false;
      setSaveStatus("saved");
    }
  }, []);

  const clientes = data ? [...new Set(data.custodias.map(c => c.cliente))].sort() : [];

  const handleNuevaCustodia = (custodia) => persistGuard(async () => {
    const [row] = await dbInsert('custodias', [toRow(custodia, CUSTODIA_FIELDS)]);
    const saved = fromRow(row, CUSTODIA_FIELDS);
    setData(d => ({ ...d, custodias: [...d.custodias, saved] }));
    setModal(null);
  }, "No se pudo guardar la custodia. Comprueba tu conexión e inténtalo de nuevo.");

  const handleEntrega = (entregaData) => persistGuard(async () => {
    const numE = formatNumE(getNextNumEntrega(data.entregas));
    const entregaConNum = { ...entregaData, numEntrega: numE };
    const custodia = data.custodias.find(c => c.id === entregaData.custodiaId);
    const nuevasUds = custodia.udsEntregadas + entregaData.uds;
    const [entRow] = await dbInsert('entregas', [toRow(entregaConNum, ENTREGA_FIELDS)]);
    await dbUpdate('custodias', custodia.id, toRow({ udsEntregadas: nuevasUds }, CUSTODIA_FIELDS));
    const savedEntrega = fromRow(entRow, ENTREGA_FIELDS);
    setData(d => ({
      ...d,
      custodias: d.custodias.map(c => c.id === custodia.id ? { ...c, udsEntregadas: nuevasUds } : c),
      entregas: [...d.entregas, savedEntrega],
    }));
    setSelectedCustodia(null);
  }, "No se pudo registrar la entrega. Comprueba tu conexión e inténtalo de nuevo.");

  const handleNuevaEntrega = (nuevasEntregas) => persistGuard(async () => {
    let nextNum = getNextNumEntrega(data.entregas);
    const grupoId = uid(); // ID compartido para identificar la entrega múltiple
    const numeradas = nuevasEntregas.map(e => ({ ...e, numEntrega: formatNumE(nextNum++), grupoEntrega: grupoId }));
    const rows = await dbInsert('entregas', numeradas.map(e => toRow(e, ENTREGA_FIELDS)));
    const savedEntregas = rows.map(r => fromRow(r, ENTREGA_FIELDS));
    // Sumar deltas por custodia (una línea puede repetir custodia) y actualizar cada una una sola vez
    const deltaPorCustodia = {};
    numeradas.forEach(e => { deltaPorCustodia[e.custodiaId] = (deltaPorCustodia[e.custodiaId] || 0) + e.uds; });
    const actualizaciones = await Promise.all(Object.entries(deltaPorCustodia).map(async ([custodiaId, delta]) => {
      const c = data.custodias.find(c => c.id === custodiaId);
      const nuevasUds = c.udsEntregadas + delta;
      await dbUpdate('custodias', custodiaId, toRow({ udsEntregadas: nuevasUds }, CUSTODIA_FIELDS));
      return { custodiaId, nuevasUds };
    }));
    setData(d => ({
      ...d,
      custodias: d.custodias.map(c => {
        const r = actualizaciones.find(r => r.custodiaId === c.id);
        return r ? { ...c, udsEntregadas: r.nuevasUds } : c;
      }),
      entregas: [...d.entregas, ...savedEntregas],
    }));
    setShowNuevaEntrega(false);
  }, "No se pudo registrar la entrega múltiple. Comprueba tu conexión e inténtalo de nuevo.");

  const handlePrestamo = (prestamoData) => persistGuard(async () => {
    // Préstamo: incrementa udsEntregadas (físicamente salen) + guarda deuda
    const custodia = data.custodias.find(c => c.id === prestamoData.custodiaId);
    const nuevasUds = custodia.udsEntregadas + prestamoData.uds;
    const [row] = await dbInsert('prestamos', [toRow(prestamoData, PRESTAMO_FIELDS)]);
    await dbUpdate('custodias', custodia.id, toRow({ udsEntregadas: nuevasUds }, CUSTODIA_FIELDS));
    const saved = fromRow(row, PRESTAMO_FIELDS);
    setData(d => ({
      ...d,
      custodias: d.custodias.map(c => c.id === custodia.id ? { ...c, udsEntregadas: nuevasUds } : c),
      prestamos: [...(d.prestamos || []), saved],
    }));
    setPrestamoTarget(null);
  }, "No se pudo registrar el préstamo. Comprueba tu conexión e inténtalo de nuevo.");

  const handleSaldarDeuda = (prestamoId) => persistGuard(async () => {
    const prestamo = (data.prestamos || []).find(p => p.id === prestamoId);
    await dbUpdate('prestamos', prestamoId, { saldado: true });
    const custodia = prestamo ? data.custodias.find(c => c.id === prestamo.custodiaId) : null;
    let nuevasUds = null;
    if (custodia) {
      nuevasUds = Math.max(0, custodia.udsEntregadas - prestamo.uds);
      await dbUpdate('custodias', custodia.id, toRow({ udsEntregadas: nuevasUds }, CUSTODIA_FIELDS));
    }
    setData(d => ({
      ...d,
      prestamos: (d.prestamos || []).map(p => p.id === prestamoId ? { ...p, saldado: true } : p),
      custodias: custodia ? d.custodias.map(c => c.id === custodia.id ? { ...c, udsEntregadas: nuevasUds } : c) : d.custodias,
    }));
  }, "No se pudo saldar la deuda. Inténtalo de nuevo.");

  const handleEditar = (updated) => persistGuard(async () => {
    const [row] = await dbUpdate('custodias', updated.id, toRow(updated, CUSTODIA_FIELDS));
    const saved = fromRow(row, CUSTODIA_FIELDS);
    setData(d => ({ ...d, custodias: d.custodias.map(c => c.id === saved.id ? saved : c) }));
    setEditTarget(null);
  }, "No se pudieron guardar los cambios. Inténtalo de nuevo.");

  const handleFontSize = (key, scale) => {
    setFontSize(key);
    localStorage.setItem('ri-fontsize', key);
    document.documentElement.style.fontSize = scale;
  };

  const handleBulkUpdateRef = (refOld, refNew, productoNew) => persistGuard(async () => {
    await dbUpdateWhere('custodias', 'referencia', refOld, { referencia: refNew, producto: productoNew });
    setData(d => ({
      ...d,
      custodias: d.custodias.map(c => c.referencia === refOld ? { ...c, referencia: refNew, producto: productoNew } : c),
    }));
  }, "No se pudo actualizar el producto. Inténtalo de nuevo.");

  const handleEditarEntrega = (entregaActualizada) => persistGuard(async () => {
    const entregaOriginal = data.entregas.find(e => e.id === entregaActualizada.id);
    const difUds = Number(entregaActualizada.uds) - Number(entregaOriginal.uds);
    const custodia = data.custodias.find(c => c.id === entregaActualizada.custodiaId);
    const nuevasUds = Math.max(0, custodia.udsEntregadas + difUds);
    const [entRow] = await dbUpdate('entregas', entregaActualizada.id, toRow(entregaActualizada, ENTREGA_FIELDS));
    await dbUpdate('custodias', custodia.id, toRow({ udsEntregadas: nuevasUds }, CUSTODIA_FIELDS));
    const savedEntrega = fromRow(entRow, ENTREGA_FIELDS);
    setData(d => ({
      ...d,
      entregas: d.entregas.map(e => e.id === savedEntrega.id ? savedEntrega : e),
      custodias: d.custodias.map(c => c.id === custodia.id ? { ...c, udsEntregadas: nuevasUds } : c),
    }));
    setEditEntregaTarget(null);
  }, "No se pudieron guardar los cambios de la entrega. Inténtalo de nuevo.");

  const handleDelete = (id) => persistGuard(async () => {
    await dbDelete('custodias', id);
    setData(d => ({ ...d, custodias: d.custodias.filter(c => c.id !== id) }));
    setDeleteTarget(null);
  }, "No se pudo eliminar la custodia. Inténtalo de nuevo.");

  const handleDeleteEntrega = (entrega) => persistGuard(async () => {
    await dbDelete('entregas', entrega.id);
    const custodia = data.custodias.find(c => c.id === entrega.custodiaId);
    let nuevasUds = null;
    if (custodia) {
      nuevasUds = Math.max(0, custodia.udsEntregadas - entrega.uds);
      await dbUpdate('custodias', custodia.id, toRow({ udsEntregadas: nuevasUds }, CUSTODIA_FIELDS));
    }
    setData(d => ({
      ...d,
      entregas: d.entregas.filter(e => e.id !== entrega.id),
      custodias: custodia ? d.custodias.map(c => c.id === custodia.id ? { ...c, udsEntregadas: nuevasUds } : c) : d.custodias,
    }));
    setDeleteEntregaTarget(null);
  }, "No se pudo eliminar la entrega. Inténtalo de nuevo.");

  const activasCnt = data ? data.custodias.filter(c => c.udsTotales - c.udsEntregadas > 0).length : 0;
  const deudasCnt = data ? (data.prestamos || []).filter(p => !p.saldado).length : 0;

  if (!data) return (
    <div className="app">
      <div className="loader"><div className="spinner" /><span>Cargando datos...</span></div>
    </div>
  );

  return (
    <div className="app">
      <header className="header">
        <div className="logo">
          <LogoAD size={40} darkMode={darkMode} />
          <div>
            <div className="logo-text">Recambios Ibiza</div>
            <div className="logo-sub">GESTOR DE STOCK EN CUSTODIA</div>
          </div>
        </div>
        <div className="header-right">
          <div className={`header-save ${saveStatus === "saved" ? "saved" : ""}`}>
            {saveStatus === "saving" ? "⟳ Guardando..." : "✓ Sincronizado"}
          </div>
          {userEmail && !isMobile && <div className="header-save" title="Sesión iniciada">👤 {userEmail}</div>}
          <button className="btn btn-ghost btn-sm" onClick={() => setShowAyuda(true)} style={{ fontWeight:700 }}>❓ Ayuda</button>
          <button className="theme-btn-sq" onClick={() => setShowConfig(s => !s)} title="Configuración">⚙️</button>
          <button className="theme-btn-sq" onClick={() => setDarkMode(d => !d)} title={darkMode ? "Modo claro" : "Modo oscuro"}>{darkMode ? <span style={{color:"#f0c040",fontSize:16}}>☀</span> : <span style={{color:"#7090d0",fontSize:15}}>☽</span>}</button>
          <button className="theme-btn-sq" onClick={onLogout} title="Cerrar sesión">🚪</button>
        </div>
      </header>

      <nav className="nav">
        {[
          { id: "dashboard",  label: "Panel de Control" },
          { id: "custodias",  label: "Custodias" },
          { id: "entregas",   label: "Entregas" },
          { id: "productos",  label: "Productos" },
          { id: "historial",  label: "Histórico" },
        ].map(t => (
          <button key={t.id} className={`nav-btn ${tab === t.id ? "active" : ""}`} onClick={() => setTab(t.id)}>
            {t.label}
          </button>
        ))}
      </nav>

      <main className="main">
        <div className="main-inner">
        {tab === "dashboard" && (
          <Dashboard
            data={data}
            isMobile={isMobile}
            onNuevaCustodia={() => !isMobile && setModal("nueva")}
            onNuevaEntrega={() => !isMobile && setShowNuevaEntrega(true)}
            onEntrega={c => setSelectedCustodia(c)}
            onDelete={c => !isMobile && setDeleteTarget(c)}
            onEditar={c => !isMobile && setEditTarget(c)}
            onEditarEntrega={e => !isMobile && setEditEntregaTarget(e)}
            onDeleteEntrega={e => !isMobile && setDeleteEntregaTarget(e)}
            onPrestamo={c => !isMobile && setPrestamoTarget(c)}
            onSaldarDeuda={handleSaldarDeuda}
          />
        )}
        {tab === "custodias" && <div className="tab-scroll"><TabCustodias data={data} /></div>}
        {tab === "entregas"  && <div className="tab-scroll"><TabEntregas data={data} /></div>}
        {tab === "productos" && <div style={{ flex:1, overflow:"hidden", display:"flex", flexDirection:"column" }}><TabProductos data={data} onBulkUpdateRef={handleBulkUpdateRef} /></div>}
        {tab === "historial" && <div style={{ flex:1, overflow:"hidden", display:"flex", flexDirection:"column" }}><Historial data={data} /></div>}
        </div>{/* end main-inner */}
      </main>

      {showConfig && (
        <PanelConfig
          fontSize={fontSize}
          onFontSize={handleFontSize}
          onClose={() => setShowConfig(false)}
          data={data}
          onChangePassword={() => setShowChangePassword(true)}
        />
      )}
      {showChangePassword && <ModalCambiarPassword onClose={() => setShowChangePassword(false)} />}
      {showAyuda && <PanelAyuda onClose={() => setShowAyuda(false)} />}
      {editEntregaTarget && (() => {
        const custodia = data.custodias.find(c => c.id === editEntregaTarget.custodiaId);
        return <ModalEditarEntrega entrega={editEntregaTarget} custodia={custodia}
          onClose={() => setEditEntregaTarget(null)} onSave={handleEditarEntrega} />;
      })()}
      {editTarget && (
        <ModalEditarCustodia custodia={editTarget} clientes={clientes} onClose={() => setEditTarget(null)} onSave={handleEditar} />
      )}
      {deleteTarget && (
        <ModalConfirmar
          titulo="¿Eliminar esta custodia?"
          tipo="danger"
          labelConfirm="🗑️ Sí, eliminar"
          mensaje={`Vas a eliminar la custodia de ${deleteTarget.cliente} · ${deleteTarget.referencia} · ${deleteTarget.producto}`}
          detalles={`Albarán: ${deleteTarget.albaran || "—"} · Almacén: ${deleteTarget.almacen} · ${deleteTarget.udsTotales - deleteTarget.udsEntregadas} ud. pendientes`}
          onConfirm={() => handleDelete(deleteTarget.id)}
          onClose={() => setDeleteTarget(null)}
        />
      )}
      {deleteEntregaTarget && (() => {
        const custodia = data.custodias.find(c => c.id === deleteEntregaTarget.custodiaId);
        return (
          <ModalConfirmar
            titulo="¿Eliminar esta entrega?"
            tipo="danger"
            labelConfirm="🗑️ Sí, eliminar"
            mensaje={`Vas a eliminar la entrega #${deleteEntregaTarget.numEntrega || "—"} de ${custodia?.cliente || "cliente desconocido"} · ${custodia?.referencia || "—"}`}
            detalles={`${deleteEntregaTarget.uds} ud. · ${fmt(deleteEntregaTarget.fecha)} · Las unidades volverán al stock disponible de esa custodia.`}
            onConfirm={() => handleDeleteEntrega(deleteEntregaTarget)}
            onClose={() => setDeleteEntregaTarget(null)}
          />
        );
      })()}
      {showNuevaEntrega && (
        <ModalNuevaEntrega data={data} onClose={() => setShowNuevaEntrega(false)} onSave={handleNuevaEntrega} />
      )}
      {modal === "nueva" && (
        <ModalNuevaCustodia clientes={clientes} custodias={data.custodias} onClose={() => setModal(null)} onSave={handleNuevaCustodia} />
      )}
      {selectedCustodia && (
        <ModalEntrega custodia={selectedCustodia} onClose={() => setSelectedCustodia(null)} onSave={handleEntrega} allCustodias={data.custodias} />
      )}
      {prestamoTarget && (
        <ModalPrestamo custodia={prestamoTarget} onClose={() => setPrestamoTarget(null)} onSave={handlePrestamo} />
      )}
    </div>
  );
}

// ─── APP RAÍZ: gestiona la sesión de login ─────────────────────────────────
function App() {
  const [session, setSession] = useState(() => loadSession());

  const handleLogout = useCallback(() => {
    logout();
    setSession(null);
  }, []);

  if (!session) {
    return <LoginScreen onLogin={() => setSession(loadSession())} />;
  }
  return <MainApp key={session.email} onLogout={handleLogout} userEmail={session.email} />;
}

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
